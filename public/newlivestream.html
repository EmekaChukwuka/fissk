<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FISSK Online Academy - Live Streaming</title>
    <!-- Cloudinary Upload Widget Script -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        h1 {
            margin-bottom: 20px;
            color: #2c3e50;
        }
        #statusContainer {
            background-color: #fff;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #controls {
            background-color: #fff;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        button:hover:not(:disabled) {
            transform: scale(1.02);
            opacity: 0.9;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }
        .btn-primary {
            background-color: #8B5FBF;
        }
        .btn-danger {
            background-color: #e74c3c;
        }
        #videoContainer {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .video-wrapper {
            flex: 1;
            min-width: 300px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 16/9;
            position: relative;
        }
        #hostVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #1a1a2e;
        }
        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
        .recording-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(231, 76, 60, 0.9);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .recording-badge.active {
            display: flex;
        }
        .recording-dot {
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        #viewersList {
            width: 280px;
            background-color: #fff;
            border-radius: 5px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #chatContainer {
            background-color: #fff;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #chatMessages {
            height: 250px;
            overflow-y: auto;
            margin-bottom: 10px;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 5px;
        }
        #chatInput {
            width: calc(100% - 90px);
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-right: 10px;
        }
        .message {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }
        .message-time {
            font-size: 0.8em;
            color: #7f8c8d;
            margin-left: 5px;
        }
        .viewer-item {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        #viewers {
            list-style: none;
            padding: 0;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
        }
        .modal-content h2 {
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .close-modal {
            float: right;
            font-size: 24px;
            cursor: pointer;
        }
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-live {
            background-color: #e74c3c;
            animation: pulse 1s infinite;
        }
        .status-offline {
            background-color: #95a5a6;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        #connectionStatus {
            font-size: 12px;
            margin-top: 5px;
            padding: 5px;
            border-radius: 4px;
        }
        .connected { color: #10b981; background: #d1fae5; }
        .connecting { color: #f59e0b; background: #fed7aa; }
        .disconnected { color: #ef4444; background: #fee2e2; }
        .upload-status {
            margin-top: 10px;
            font-size: 12px;
            display: none;
        }
        .upload-status.active {
            display: block;
        }
    </style>
</head>
<body>
    <h1>🎥 FISSK Online Academy Live Class</h1>
    
    <div id="statusContainer">
        <p>
            <span id="streamStatus" class="status-indicator status-offline"></span>
            <span id="statusText">Offline</span>
        </p>
        <div id="connectionStatus" class="connecting">🔌 Connecting to server...</div>
    </div>
    
    <div id="controls">
        <button id="startStreamBtn" class="btn-primary">🎥 Start Livestream</button>
        <button id="stopStreamBtn" class="btn-danger" disabled>🔴 End Stream</button>
        <button id="joinBtn" disabled>👤 Join Stream</button>
    </div>
    
    <div id="videoContainer">
        <div class="video-wrapper">
            <video id="hostVideo" autoplay playsinline muted></video>
            <div class="video-label" id="videoLabel">📹 No Stream</div>
            <div id="recordingBadge" class="recording-badge">
                <span class="recording-dot"></span>
                <span>RECORDING</span>
            </div>
        </div>
        <div id="viewersList">
            <h3>Viewers (<span id="viewerCount">0</span>)</h3>
            <ul id="viewers"></ul>
        </div>
    </div>
    
    <div id="chatContainer">
        <h2>Live Chat</h2>
        <div id="chatMessages"></div>
        <div>
            <input type="text" id="chatInput" placeholder="Type your message..." disabled>
            <button id="sendChatBtn" disabled>Send</button>
        </div>
    </div>
    
    <div id="createClassModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('createClassModal')">&times;</span>
            <h2>Start Livestream</h2>
            <div class="form-group">
                <label>Select Class</label>
                <select id="streamClass" required>
                    <option value="">Choose a class...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Stream Title</label>
                <input type="text" id="title" placeholder="e.g., Advanced JavaScript" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="description" rows="3" placeholder="What will you teach?"></textarea>
            </div>
            <div id="uploadStatus" class="upload-status">
                <p>📤 Preparing upload...</p>
            </div>
            <div class="form-actions">
                <button id="confirmStartBtn" class="btn-primary">Go Live</button>
                <button onclick="closeModal('createClassModal')">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // ===== CONFIGURATION =====
        const BACKEND_URL = 'https://fissk-backend.onrender.com';
        const WS_URL = 'wss://fissk-backend.onrender.com';
        
        // Cloudinary configuration (from your test)
        const CLOUDINARY_CLOUD_NAME = 'dqlvw79pw';
        const CLOUDINARY_API_KEY = '832826671417898';
        const CLOUDINARY_UPLOAD_PRESET = 'fissk_live'; // Create this unsigned preset
        
        // ===== GLOBAL VARIABLES =====
        let localStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let socket = null;
        let isHost = false;
        let streamActive = false;
        let userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        let userName = '';
        let totalUniqueViewers = new Set();
        let streamStartTime = null;
        let currentStreamData = { title: '', description: '', classId: '' };
        let cloudinaryWidget = null;
        
        // ===== DOM ELEMENTS =====
        const startBtn = document.getElementById('startStreamBtn');
        const stopBtn = document.getElementById('stopStreamBtn');
        const joinBtn = document.getElementById('joinBtn');
        const hostVideo = document.getElementById('hostVideo');
        const videoLabel = document.getElementById('videoLabel');
        const chatInput = document.getElementById('chatInput');
        const sendChatBtn = document.getElementById('sendChatBtn');
        const chatMessages = document.getElementById('chatMessages');
        const viewersList = document.getElementById('viewers');
        const viewerCountSpan = document.getElementById('viewerCount');
        const streamStatusSpan = document.getElementById('streamStatus');
        const statusTextSpan = document.getElementById('statusText');
        const connectionStatusDiv = document.getElementById('connectionStatus');
        const recordingBadge = document.getElementById('recordingBadge');
        
        // ===== HELPER FUNCTIONS =====
        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function formatTime(timestamp) {
            try {
                return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } catch(e) { return ''; }
        }
        
        function showModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function showToast(msg, isError = false) {
            const toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.cssText = `
                position: fixed; bottom: 20px; right: 20px;
                background: ${isError ? '#ef4444' : '#10b981'};
                color: white; padding: 10px 20px; border-radius: 8px;
                z-index: 9999; animation: slideIn 0.3s ease;
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function updateConnectionStatus(status, msg) {
            connectionStatusDiv.className = status;
            connectionStatusDiv.innerHTML = msg;
        }
        
        function updateStreamStatus(isLive) {
            streamActive = isLive;
            if (isLive) {
                streamStatusSpan.className = 'status-indicator status-live';
                statusTextSpan.textContent = 'Live';
                if (!isHost) joinBtn.disabled = false;
            } else {
                streamStatusSpan.className = 'status-indicator status-offline';
                statusTextSpan.textContent = 'Offline';
                joinBtn.disabled = true;
            }
        }
        
        // ===== CLOUDINARY UPLOAD USING FETCH (NO XHR) =====
        async function uploadToCloudinary(blob, streamName, classId) {
            const uploadStatus = document.getElementById('uploadStatus');
            uploadStatus.classList.add('active');
            uploadStatus.innerHTML = '<p>📤 Uploading to Cloudinary...</p>';
            
            try {
                // First, get the upload signature from your backend
                const signRes = await fetch(`${BACKEND_URL}/api/cloudinary/sign-upload`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        folder: `livestreams/${classId}`,
                        publicId: streamName,
                        resourceType: 'video'
                    })
                });
                
                const signData = await signRes.json();
                console.log('Signature received');
                
                // Prepare form data for Cloudinary
                const formData = new FormData();
                formData.append('file', blob);
                formData.append('api_key', signData.api_key);
                formData.append('timestamp', signData.timestamp);
                formData.append('signature', signData.signature);
                formData.append('folder', signData.folder);
                formData.append('public_id', streamName);
                formData.append('resource_type', 'video');
                
                // Use fetch API instead of XHR
                const response = await fetch(`https://api.cloudinary.com/v1_1/${signData.cloud_name}/video/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Upload failed: ${response.status} - ${errorText}`);
                }
                
                const result = await response.json();
                uploadStatus.classList.remove('active');
                console.log('✅ Upload successful:', result.secure_url);
                return result;
                
            } catch (err) {
                uploadStatus.classList.remove('active');
                console.error('Upload error:', err);
                throw err;
            }
        }
        
        // Alternative: Use the Cloudinary Upload Widget (even simpler!)
        function uploadWithWidget(blob, streamName, classId) {
            return new Promise((resolve, reject) => {
                // Create a File from the blob
                const file = new File([blob], `${streamName}.webm`, { type: 'video/webm' });
                
                // Initialize Cloudinary Widget
                const widget = cloudinary.createUploadWidget(
                    {
                        cloudName: CLOUDINARY_CLOUD_NAME,
                        uploadPreset: CLOUDINARY_UPLOAD_PRESET,
                        folder: `livestreams/${classId}`,
                        publicId: streamName,
                        resourceType: 'video',
                        sources: ['local'],
                        multiple: false,
                        showUploadMoreButton: false,
                        showCompletedButton: false
                    },
                    (error, result) => {
                        if (error) {
                            reject(error);
                        } else if (result && result.event === 'success') {
                            resolve(result.info);
                        }
                    }
                );
                
                // Open widget with the file
                widget.open();
                // Programmatically add the file
                widget.setFileList([file]);
            });
        }
        
        // ===== LOAD CLASSES =====
        async function loadInstructorClasses() {
            try {
                const user = JSON.parse(localStorage.getItem('user'));
                if (!user) return;
                const res = await fetch(`${BACKEND_URL}/register/instructor/classes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: user.id })
                });
                const json = await res.json();
                const classes = json.classes || [];
                const select = document.getElementById('streamClass');
                select.innerHTML = '<option value="">Choose a class...</option>' + 
                    classes.map(c => `<option value="${c._id || c.id}">${escapeHtml(c.title)}</option>`).join('');
            } catch(err) {
                console.error(err);
            }
        }
        
        // ===== WEBSOCKET =====
        function initWebSocket() {
            if (socket && socket.readyState === WebSocket.OPEN) return;
            
            updateConnectionStatus('connecting', '🔌 Connecting...');
            
            try {
                socket = new WebSocket(WS_URL);
                socket.onopen = () => {
                    console.log('WebSocket connected');
                    updateConnectionStatus('connected', '✅ Connected');
                    
                    if (isHost) {
                        socket.send(JSON.stringify({ type: 'register_host', userId, userName: 'Instructor' }));
                        if (localStream) socket.send(JSON.stringify({ type: 'stream_started', userId }));
                    } else {
                        socket.send(JSON.stringify({ type: 'register_viewer', userId, userName }));
                    }
                    socket.send(JSON.stringify({ type: 'request_stream_status' }));
                };
                
                socket.onmessage = (e) => {
                    try {
                        const msg = JSON.parse(e.data);
                        console.log('📨', msg.type);
                        handleMessage(msg);
                    } catch(err) {}
                };
                
                socket.onerror = () => updateConnectionStatus('disconnected', '❌ Connection error');
                socket.onclose = () => {
                    updateConnectionStatus('disconnected', '❌ Disconnected');
                    setTimeout(initWebSocket, 3000);
                };
            } catch(err) {
                console.error(err);
            }
        }
        
        function handleMessage(msg) {
            switch(msg.type) {
                case 'stream_status':
                    updateStreamStatus(msg.active);
                    break;
                case 'chat_message':
                    displayChatMessage(msg);
                    break;
                case 'viewer_list':
                    updateViewersList(msg.viewers);
                    break;
                case 'stream_ended':
                    if (!isHost) {
                        hostVideo.srcObject = null;
                        videoLabel.textContent = '📹 Stream Ended';
                        updateStreamStatus(false);
                        showToast('Stream ended');
                    }
                    break;
            }
        }
        
        function updateViewersList(viewers) {
            viewersList.innerHTML = '';
            viewers.forEach(v => {
                const li = document.createElement('li');
                li.className = 'viewer-item';
                li.textContent = v.name || v.userName;
                viewersList.appendChild(li);
                totalUniqueViewers.add(v.id || v.userId);
            });
            viewerCountSpan.textContent = viewers.length;
        }
        
        function displayChatMessage(msg) {
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<strong>${escapeHtml(msg.userName)}:</strong> ${escapeHtml(msg.message)}<span class="message-time">${formatTime(msg.timestamp)}</span>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function sendChatMessage() {
            const message = chatInput.value.trim();
            if (!message) return;
            const chatMsg = {
                type: 'chat_message',
                userId, userName: isHost ? '🎙️ Instructor' : userName,
                message, timestamp: new Date().toISOString()
            };
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(chatMsg));
                displayChatMessage(chatMsg);
                chatInput.value = '';
            }
        }
        
        // ===== START LIVESTREAM =====
        async function startLivestream() {
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const classId = document.getElementById('streamClass').value;
            
            if (!classId || !title) {
                alert('Please select a class and enter a title');
                return;
            }
            
            try {
                closeModal('createClassModal');
                isHost = true;
                currentStreamData = { title, description, classId };
                
                showToast('Requesting camera...');
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                hostVideo.srcObject = localStream;
                videoLabel.textContent = '🎥 Your Stream (Host)';
                hostVideo.muted = false;
                
                initWebSocket();
                await new Promise(r => setTimeout(r, 500));
                
                startBtn.disabled = true;
                stopBtn.disabled = false;
                joinBtn.disabled = true;
                chatInput.disabled = false;
                sendChatBtn.disabled = false;
                recordingBadge.classList.add('active');
                updateStreamStatus(true);
                streamStartTime = Date.now();
                
                // Start recording
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(localStream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };
                mediaRecorder.start(5000);
                
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: 'stream_started', userId }));
                }
                
                showToast('✅ Livestream started!');
            } catch(err) {
                console.error(err);
                alert('Failed to start: ' + err.message);
                isHost = false;
                startBtn.disabled = false;
            }
        }
        
        // ===== STOP & SAVE TO CLOUDINARY (USING FETCH) =====
        async function stopLivestream() {
            if (!confirm('End stream and save recording?')) return;
            
            try {
                recordingBadge.classList.remove('active');
                showToast('Processing recording...');
                
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    await new Promise(r => { mediaRecorder.onstop = r; mediaRecorder.stop(); });
                    
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const streamName = `${currentStreamData.title.replace(/[^a-z0-9]/gi, '_')}_${Date.now()}`;
                    
                    // Upload to Cloudinary using fetch (no XHR)
                    try {
                        showToast('📤 Uploading to Cloudinary...');
                        const result = await uploadToCloudinary(blob, streamName, currentStreamData.classId);
                        showToast('✅ Saved to Cloudinary!');
                        console.log('Cloudinary URL:', result.secure_url);
                        
                        // Save metadata to backend
                        await saveMetadata(result, streamName);
                    } catch(uploadErr) {
                        console.error('Cloudinary failed:', uploadErr);
                        showToast('⚠️ Cloudinary failed - saving locally', true);
                        // Fallback: download locally
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `${streamName}.webm`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }
                }
                
                if (localStream) localStream.getTracks().forEach(t => t.stop());
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: 'stream_ended' }));
                }
                
                hostVideo.srcObject = null;
                videoLabel.textContent = '📹 No Stream';
                startBtn.disabled = false;
                stopBtn.disabled = true;
                chatInput.disabled = true;
                sendChatBtn.disabled = true;
                isHost = false;
                updateStreamStatus(false);
                showToast('Stream ended');
                
            } catch(err) {
                console.error(err);
                alert('Error: ' + err.message);
            }
        }
        
        async function saveMetadata(cloudinaryResult, streamName) {
            try {
                const user = JSON.parse(localStorage.getItem('user'));
                const duration = Math.floor((Date.now() - streamStartTime) / 1000);
                const minutes = Math.floor(duration / 60);
                
                await fetch(`${BACKEND_URL}/api/save-stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: user?.id,
                        streamName: streamName,
                        streamClass: currentStreamData.classId,
                        classTitle: currentStreamData.title,
                        classDescription: currentStreamData.description,
                        participants: totalUniqueViewers.size,
                        duration: `${minutes} min, ${duration % 60} sec`,
                        cloudinaryUrl: cloudinaryResult.secure_url,
                        cloudinaryPublicId: cloudinaryResult.public_id
                    })
                });
                console.log('Metadata saved');
            } catch(err) { console.error(err); }
        }
        
        async function joinLivestream() {
            if (!streamActive) {
                showToast('No live stream available', true);
                return;
            }
            joinBtn.disabled = true;
            isHost = false;
            initWebSocket();
            showToast('Joining stream...');
            setTimeout(() => { joinBtn.disabled = false; }, 3000);
        }
        
        // ===== EVENT LISTENERS =====
        document.getElementById('confirmStartBtn').addEventListener('click', startLivestream);
        startBtn.addEventListener('click', () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user || user.user_type !== 'instructor') {
                alert('Only instructors can start livestreams');
                return;
            }
            loadInstructorClasses().then(() => showModal('createClassModal'));
        });
        stopBtn.addEventListener('click', stopLivestream);
        joinBtn.addEventListener('click', joinLivestream);
        sendChatBtn.addEventListener('click', sendChatMessage);
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChatMessage(); });
        
        // ===== INITIALIZE =====
        const storedUser = JSON.parse(localStorage.getItem('user'));
        if (storedUser) userName = storedUser.name || storedUser.email || 'Viewer';
        initWebSocket();
        updateStreamStatus(false);
    </script>
</body>
</html>
