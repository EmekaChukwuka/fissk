<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="fissklogo.jpg">
    <title>FISSK Online Academy - Live Streaming with Cloudinary</title>
    <style>
        :root {
            --primary: #8B5FBF;
            --primary-light: #9D69DD;
            --primary-dark: #7A4BA6;
            --secondary: #6C63FF;
            --accent: #FF6B8B;
            --text-dark: #2D3748;
            --text-light: #718096;
            --background: #FAF7FF;
            --white: #FFFFFF;
            --gray-light: #F7FAFC;
            --border: #E2E8F0;
            --success: #10B981;
            --error: #EF4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        h1, h2, h3 {
            color: #2c3e50;
        }
        #statusContainer {
            background-color: #fff;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #controls {
            background-color: #fff;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        #videoContainer {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        #hostVideo {
            flex: 1;
            min-width: 300px;
            background: #000;
            border-radius: 5px;
            aspect-ratio: 16/9;
            background-color: #1a1a2e;
        }
        #viewersList {
            width: 300px;
            background-color: #fff;
            border-radius: 5px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #chatContainer {
            background-color: #fff;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #chatMessages {
            height: 300px;
            overflow-y: auto;
            margin-bottom: 10px;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 3px;
        }
        #chatInput {
            width: calc(100% - 90px);
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
            margin-right: 10px;
        }
        button {
            padding: 8px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover:not(:disabled) {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .btn-primary {
            background-color: var(--primary);
        }
        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-dark);
        }
        .btn-danger {
            background-color: var(--error);
        }
        .btn-danger:hover:not(:disabled) {
            background-color: #dc2626;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-live {
            background-color: #e74c3c;
            animation: pulse 1.5s infinite;
        }
        .status-offline {
            background-color: #95a5a6;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .message {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }
        .message-time {
            font-size: 0.8em;
            color: #7f8c8d;
            margin-left: 5px;
        }
        .viewer-item {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        #viewers {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .modal-content h2 {
            margin-bottom: 20px;
            color: var(--text-dark);
            font-size: 1.5rem;
            font-weight: 700;
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            transition: color 0.3s ease;
        }
        .close-modal:hover {
            color: var(--text-dark);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 0.9rem;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--white);
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 95, 191, 0.1);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        .upload-progress {
            margin-top: 15px;
            display: none;
        }
        .upload-progress.active {
            display: block;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: width 0.3s;
        }
        .recording-indicator {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(231, 76, 60, 0.9);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: none;
            align-items: center;
            gap: 8px;
            z-index: 100;
        }
        .recording-indicator.active {
            display: flex;
        }
        .recording-dot {
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .video-wrapper {
            position: relative;
            flex: 1;
            min-width: 300px;
        }
    </style>
</head>
<body>
    <h1>FISSK Online Academy Live Class (Cloudinary)</h1>
    
    <div id="statusContainer">
        <p>Stream Status: 
            <span id="streamStatus" class="status-indicator status-offline"></span>
            <span id="statusText">Offline</span>
        </p>
        <p id="cloudinaryStatus" style="font-size: 12px; color: #666; margin-top: 5px;"></p>
    </div>
    
    <div id="controls">
        <button id="startStreamBtn" class="btn-primary">🎥 Start Livestream</button>
        <button id="stopStreamBtn" class="btn-danger" disabled>🔴 End Stream</button>
        <button id="joinBtn" disabled>👤 Join Stream</button>
        <button id="viewRecordingsBtn">📹 Past Recordings</button>
    </div>
    
    <div id="videoContainer">
        <div class="video-wrapper">
            <video id="hostVideo" autoplay playsinline muted></video>
            <div id="recordingIndicator" class="recording-indicator">
                <span class="recording-dot"></span>
                <span>🔴 RECORDING</span>
            </div>
        </div>
        <div id="viewersList">
            <h3>Viewers (<span id="viewerCount">0</span>)</h3>
            <ul id="viewers"></ul>
        </div>
    </div>
    
    <div id="chatContainer">
        <h2>Live Chat</h2>
        <div id="chatMessages"></div>
        <div>
            <input type="text" id="chatInput" placeholder="Type your message..." disabled>
            <button id="sendChatBtn" disabled>Send</button>
        </div>
    </div>
    
    <div id="createClassModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('createClassModal')">&times;</span>
            <h2>Start Livestream with Cloudinary</h2>
            <div id="createClassForm">
                <div class="form-group">
                    <label for="streamClass">Select Class</label>
                    <select id="streamClass" required>
                        <option value="">Choose a class...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="title">Stream Name</label>
                    <input type="text" id="title" name="title" placeholder="e.g., Advanced JavaScript" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="3" placeholder="What will you teach?" required></textarea>
                </div>
                <div class="form-group">
                    <label>Video Quality</label>
                    <select id="quality">
                        <option value="720">HD (720p)</option>
                        <option value="1080" selected>Full HD (1080p)</option>
                    </select>
                </div>
                <div id="uploadProgress" class="upload-progress">
                    <p style="font-size: 12px;">Preparing stream...</p>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
                <div class="form-actions">
                    <button class="btn-primary" onclick="startLivestreamWithCloudinary()">Go Live with Cloudinary</button>
                    <button type="button" onclick="closeModal('createClassModal')">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <div id="recordingsModal" class="modal">
        <div class="modal-content" style="max-width: 800px;">
            <span class="close-modal" onclick="closeModal('recordingsModal')">&times;</span>
            <h2>📹 Past Livestream Recordings</h2>
            <div id="recordingsList" style="max-height: 500px; overflow-y: auto;"></div>
        </div>
    </div>

    <script>
        // Configuration
        const BACKEND_URL = 'https://fissk-backend.onrender.com';
        
        // Global variables
        let mediaRecorder = null;
        let recordedChunks = [];
        let localStream = null;
        let socket = null;
        let isHost = false;
        let streamActive = false;
        let userId = generateId();
        let userName = `User_${Math.floor(Math.random() * 1000)}`;
        let totalUniqueViewers = new Set();
        let streamStartTime = null;
        let currentStreamData = {
            title: '',
            description: '',
            classId: '',
            className: ''
        };
        
        // DOM Elements
        const startBtn = document.getElementById('startStreamBtn');
        const joinBtn = document.getElementById('joinBtn');
        const stopBtn = document.getElementById('stopStreamBtn');
        const viewRecordingsBtn = document.getElementById('viewRecordingsBtn');
        const hostVideo = document.getElementById('hostVideo');
        const chatInput = document.getElementById('chatInput');
        const sendChatBtn = document.getElementById('sendChatBtn');
        const chatMessages = document.getElementById('chatMessages');
        const viewersList = document.getElementById('viewers');
        const viewerCount = document.getElementById('viewerCount');
        const streamStatus = document.getElementById('streamStatus');
        const statusText = document.getElementById('statusText');
        const cloudinaryStatus = document.getElementById('cloudinaryStatus');
        const recordingIndicator = document.getElementById('recordingIndicator');
        
        // Helper functions
        function generateId() {
            return Math.random().toString(36).substring(2, 15) + Date.now();
        }
        
        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[ch]);
        }
        
        function formatTime(timestamp) {
            try {
                const date = new Date(timestamp);
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return '';
            }
        }
        
        function showModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }
        
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
        
        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: ${isError ? '#ef4444' : '#10b981'};
                color: white;
                padding: 10px 20px;
                border-radius: 8px;
                z-index: 9999;
                animation: slideIn 0.3s ease;
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // Load instructor classes
        async function loadInstructorClasses() {
            try {
                const user = JSON.parse(localStorage.getItem('user'));
                if (!user) return;
                const res = await fetch(`${BACKEND_URL}/register/instructor/classes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: user.id })
                });
                const json = await res.json();
                const classes = Array.isArray(json?.classes) ? json.classes : [];
                const streamClass = document.getElementById('streamClass');
                streamClass.innerHTML = '<option value="">Choose a class...</option>' + 
                    classes.map(c => `<option value="${c._id || c.id}">${escapeHtml(c.title)}</option>`).join('');
            } catch (err) {
                console.error('loadInstructorClasses error', err);
            }
        }
        
        // Upload to Cloudinary with progress
        async function uploadToCloudinary(blob, streamName, classId) {
            return new Promise(async (resolve, reject) => {
                const progressDiv = document.getElementById('uploadProgress');
                const progressFill = document.getElementById('progressFill');
                progressDiv.classList.add('active');
                
                try {
                    // Get signed upload parameters
                    const signRes = await fetch(`${BACKEND_URL}/api/cloudinary/sign-upload`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            folder: `livestreams/${classId}`,
                            publicId: streamName
                        })
                    });
                    
                    const { signature, timestamp, cloud_name, api_key, folder } = await signRes.json();
                    
                    // Upload to Cloudinary
                    const formData = new FormData();
                    formData.append('file', blob);
                    formData.append('api_key', api_key);
                    formData.append('timestamp', timestamp);
                    formData.append('signature', signature);
                    formData.append('folder', folder);
                    formData.append('public_id', streamName);
                    formData.append('resource_type', 'video');
                    
                    const xhr = new XMLHttpRequest();
                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const percent = (e.loaded / e.total) * 100;
                            progressFill.style.width = percent + '%';
                        }
                    });
                    
                    xhr.onload = () => {
                        if (xhr.status === 200) {
                            const result = JSON.parse(xhr.responseText);
                            progressDiv.classList.remove('active');
                            resolve(result);
                        } else {
                            reject(new Error('Upload failed'));
                        }
                    };
                    
                    xhr.onerror = () => reject(new Error('Network error'));
                    xhr.open('POST', `https://api.cloudinary.com/v1_1/${cloud_name}/video/upload`);
                    xhr.send(formData);
                    
                } catch (err) {
                    progressDiv.classList.remove('active');
                    reject(err);
                }
            });
        }
        
        // Start livestream with Cloudinary recording
        async function startLivestreamWithCloudinary() {
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const classId = document.getElementById('streamClass').value;
            const quality = document.getElementById('quality').value;
            
            if (!classId || !title) {
                alert('Please select a class and enter a stream name');
                return;
            }
            
            try {
                closeModal('createClassModal');
                isHost = true;
                currentStreamData = { title, description, classId };
                
                // Get class name
                const classRes = await fetch(`${BACKEND_URL}/register/class/${classId}`);
                const classData = await classRes.json();
                currentStreamData.className = classData.classA?.[0]?.title || 'Class';
                
                cloudinaryStatus.textContent = '📡 Initializing camera...';
                
                // Get user media
                const constraints = {
                    video: quality === '720' ? { width: 1280, height: 720 } : { width: 1920, height: 1080 },
                    audio: true
                };
                
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                hostVideo.srcObject = localStream;
                hostVideo.muted = false;
                
                cloudinaryStatus.textContent = '🎥 Recording started - will save to Cloudinary when ended';
                
                // Start recording
                recordedChunks = [];
                mediaRecorder = new MediaRecorder(localStream, {
                    mimeType: 'video/webm',
                    videoBitsPerSecond: quality === '720' ? 2500000 : 5000000
                });
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };
                
                mediaRecorder.start(5000); // 5-second chunks
                
                // Update UI
                startBtn.disabled = true;
                stopBtn.disabled = false;
                joinBtn.disabled = true;
                chatInput.disabled = false;
                sendChatBtn.disabled = false;
                recordingIndicator.classList.add('active');
                updateStreamStatus(true);
                streamStartTime = Date.now();
                
                // Initialize WebSocket for chat
                initWebSocket();
                
                showToast('✅ Livestream started! Recording to Cloudinary on end.');
                
            } catch (err) {
                console.error('Error starting stream:', err);
                alert('Failed to start stream: ' + err.message);
                isHost = false;
                startBtn.disabled = false;
                cloudinaryStatus.textContent = '';
            }
        }
        
        // Stop stream and upload to Cloudinary
        async function stopLivestream() {
            if (!confirm('End stream and save recording to Cloudinary?')) return;
            
            try {
                recordingIndicator.classList.remove('active');
                cloudinaryStatus.textContent = '📤 Uploading to Cloudinary...';
                showToast('Processing recording...');
                
                // Stop recording
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    await new Promise((resolve) => {
                        mediaRecorder.onstop = resolve;
                        mediaRecorder.stop();
                    });
                    
                    // Combine all chunks
                    const completeBlob = new Blob(recordedChunks, { type: 'video/webm' });
                    const streamName = `${currentStreamData.title.replace(/[^a-z0-9]/gi, '_')}_${Date.now()}`;
                    
                    // Upload to Cloudinary
                    const uploadResult = await uploadToCloudinary(completeBlob, streamName, currentStreamData.classId);
                    
                    cloudinaryStatus.textContent = '✅ Saved to Cloudinary!';
                    showToast('✅ Recording saved to Cloudinary!');
                    
                    // Save metadata to backend
                    await saveStreamMetadata(uploadResult, streamName);
                }
                
                // Stop local stream
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                    localStream = null;
                }
                
                // Reset UI
                hostVideo.srcObject = null;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                chatInput.disabled = true;
                sendChatBtn.disabled = true;
                isHost = false;
                updateStreamStatus(false);
                
                setTimeout(() => {
                    cloudinaryStatus.textContent = '';
                }, 3000);
                
            } catch (err) {
                console.error('Error stopping stream:', err);
                alert('Error saving stream: ' + err.message);
                cloudinaryStatus.textContent = '❌ Upload failed';
            }
        }
        
        async function saveStreamMetadata(cloudinaryResult, streamName) {
            try {
                const user = JSON.parse(localStorage.getItem('user'));
                const durationSec = Math.floor((Date.now() - streamStartTime) / 1000);
                const durationMin = Math.floor(durationSec / 60);
                
                const formData = new FormData();
                formData.append('userId', user.id);
                formData.append('streamName', streamName);
                formData.append('streamClass', currentStreamData.classId);
                formData.append('classTitle', currentStreamData.title);
                formData.append('classDescription', currentStreamData.description);
                formData.append('participants', totalUniqueViewers.size);
                formData.append('duration', `${durationMin} min, ${durationSec % 60} sec`);
                formData.append('cloudinaryUrl', cloudinaryResult.secure_url);
                formData.append('cloudinaryPublicId', cloudinaryResult.public_id);
                
                // Create a dummy blob for the form data (or send JSON)
                const response = await fetch(`${BACKEND_URL}/api/save-stream`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: user.id,
                        streamName: streamName,
                        streamClass: currentStreamData.classId,
                        classTitle: currentStreamData.title,
                        classDescription: currentStreamData.description,
                        participants: totalUniqueViewers.size,
                        duration: `${durationMin} min, ${durationSec % 60} sec`,
                        cloudinaryUrl: cloudinaryResult.secure_url,
                        cloudinaryPublicId: cloudinaryResult.public_id
                    })
                });
                
                const result = await response.json();
                console.log('Metadata saved:', result);
            } catch (err) {
                console.error('Error saving metadata:', err);
            }
        }
        
        // Load past recordings from Cloudinary via backend
        async function loadPastRecordings() {
            try {
                const classId = prompt('Enter Class ID to view recordings:');
                if (!classId) return;
                
                showToast('Loading recordings...');
                const response = await fetch(`${BACKEND_URL}/api/by-class/${classId}`);
                const recordings = await response.json();
                
                const recordingsList = document.getElementById('recordingsList');
                if (recordings.length === 0) {
                    recordingsList.innerHTML = '<p>No recordings found for this class.</p>';
                } else {
                    recordingsList.innerHTML = recordings.map(rec => `
                        <div style="margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 8px;">
                            <h4>${escapeHtml(rec.filename || rec.name || 'Recording')}</h4>
                            <p>Duration: ${rec.duration || 'Unknown'}</p>
                            <p>Recorded: ${new Date(rec.uploadDate || rec.createdAt).toLocaleString()}</p>
                            ${rec.hlsUrl ? `
                                <video controls style="width: 100%; max-height: 300px; margin-top: 10px;">
                                    <source src="${rec.hlsUrl}" type="application/x-mpegURL">
                                </video>
                            ` : rec.url ? `
                                <video controls style="width: 100%; max-height: 300px; margin-top: 10px;">
                                    <source src="${rec.url}" type="video/mp4">
                                </video>
                            ` : ''}
                            <button onclick="window.open('${rec.url || rec.hlsUrl}', '_blank')" style="margin-top: 10px;">
                                Open in Cloudinary
                            </button>
                        </div>
                    `).join('');
                }
                
                showModal('recordingsModal');
            } catch (err) {
                console.error('Error loading recordings:', err);
                alert('Error loading recordings: ' + err.message);
            }
        }
        
        // WebSocket for chat (simplified)
        function initWebSocket() {
            if (socket && socket.readyState === WebSocket.OPEN) return;
            socket = new WebSocket('wss://fissk-backend.onrender.com');
            socket.onopen = () => {
                console.log('WebSocket connected');
                if (isHost) {
                    socket.send(JSON.stringify({ type: 'register_host', userId }));
                } else {
                    socket.send(JSON.stringify({ type: 'register_viewer', userId, userName }));
                }
                socket.send(JSON.stringify({ type: 'request_stream_status' }));
            };
            socket.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.type === 'chat_message') {
                    displayChatMessage(msg);
                } else if (msg.type === 'viewer_list') {
                    updateViewersList(msg.viewers);
                } else if (msg.type === 'stream_status') {
                    updateStreamStatus(msg.active);
                }
            };
            socket.onclose = () => {
                console.log('WebSocket disconnected');
                setTimeout(initWebSocket, 3000);
            };
        }
        
        // Join as viewer (WebRTC fallback)
        async function joinLivestream() {
            if (!streamActive) {
                showToast('No live stream available', true);
                return;
            }
            joinBtn.disabled = true;
            showToast('Joining stream...');
            // Simplified join - actual WebRTC would go here
            setTimeout(() => {
                joinBtn.disabled = false;
            }, 2000);
        }
        
        function updateStreamStatus(isActive) {
            streamActive = isActive;
            if (isActive) {
                streamStatus.className = 'status-indicator status-live';
                statusText.textContent = 'Live';
                if (!isHost) joinBtn.disabled = false;
            } else {
                streamStatus.className = 'status-indicator status-offline';
                statusText.textContent = 'Offline';
                joinBtn.disabled = true;
            }
        }
        
        function updateViewersList(viewers) {
            viewersList.innerHTML = '';
            viewers.forEach(viewer => {
                const li = document.createElement('li');
                li.className = 'viewer-item';
                li.textContent = viewer.name || viewer.userName;
                viewersList.appendChild(li);
                totalUniqueViewers.add(viewer.id || viewer.userId);
            });
            viewerCount.textContent = viewers.length;
        }
        
        function displayChatMessage(msg) {
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<strong>${escapeHtml(msg.userName)}:</strong> ${escapeHtml(msg.message)}<span class="message-time">${formatTime(msg.timestamp)}</span>`;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function sendChatMessage() {
            const message = chatInput.value.trim();
            if (!message) return;
            const chatMsg = {
                type: 'chat_message',
                userId,
                userName: isHost ? '🎙️ Instructor' : userName,
                message,
                timestamp: new Date().toISOString()
            };
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(chatMsg));
                displayChatMessage(chatMsg);
                chatInput.value = '';
            }
        }
        
        // Event listeners
        startBtn.addEventListener('click', () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user || user.user_type !== 'instructor') {
                alert('Only instructors can start livestreams');
                return;
            }
            loadInstructorClasses().then(() => showModal('createClassModal'));
        });
        
        stopBtn.addEventListener('click', stopLivestream);
        joinBtn.addEventListener('click', joinLivestream);
        viewRecordingsBtn.addEventListener('click', loadPastRecordings);
        sendChatBtn.addEventListener('click', sendChatMessage);
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChatMessage(); });
        
        // Initialize
        const storedUser = JSON.parse(localStorage.getItem('user'));
        if (storedUser) userName = storedUser.name || userName;
        initWebSocket();
        updateStreamStatus(false);
        
        // Add CSS animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
