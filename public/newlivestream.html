<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="fissklogo.jpg">
    <title>FISSK Online Academy - Live Streaming</title>
    <style>
        :root {
            --primary: #8B5FBF;
            --primary-light: #9D69DD;
            --primary-dark: #7A4BA6;
            --secondary: #6C63FF;
            --accent: #FF6B8B;
            --text-dark: #2D3748;
            --text-light: #718096;
            --background: #FAF7FF;
            --white: #FFFFFF;
            --gray-light: #F7FAFC;
            --border: #E2E8F0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        h1, h2, h3 {
            color: #2c3e50;
        }
        #statusContainer {
            background-color: #fff;
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #controls {
            background-color: #fff;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        #videoContainer {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        #hostVideo {
            flex: 1;
            min-width: 300px;
            background: #000;
            border-radius: 5px;
            aspect-ratio: 16/9;
            background-color: #1a1a2e;
        }
        #viewersList {
            width: 300px;
            background-color: #fff;
            border-radius: 5px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #chatContainer {
            background-color: #fff;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #chatMessages {
            height: 300px;
            overflow-y: auto;
            margin-bottom: 10px;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 3px;
        }
        #chatInput {
            width: calc(100% - 90px);
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
            margin-right: 10px;
        }
        button {
            padding: 8px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover:not(:disabled) {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .btn-danger {
            background-color: #e74c3c;
        }
        .btn-danger:hover:not(:disabled) {
            background-color: #c0392b;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-live {
            background-color: #e74c3c;
            animation: pulse 1.5s infinite;
        }
        .status-offline {
            background-color: #95a5a6;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .message {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }
        .message-time {
            font-size: 0.8em;
            color: #7f8c8d;
            margin-left: 5px;
        }
        .viewer-item {
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        #viewers {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .modal-content h2 {
            margin-bottom: 20px;
            color: var(--text-dark);
            font-size: 1.5rem;
            font-weight: 700;
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            transition: color 0.3s ease;
        }
        .close-modal:hover {
            color: var(--text-dark);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-weight: 500;
            font-size: 0.9rem;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--white);
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 95, 191, 0.1);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        .btn-primary {
            background-color: var(--primary);
        }
        .btn-primary:hover {
            background-color: var(--primary-dark);
        }
        .btn-outline {
            background-color: #95a5a6;
        }
    </style>
</head>
<body>
    <h1>FISSK Online Academy Live Class</h1>
    
    <div id="statusContainer">
        <p>Stream Status: 
            <span id="streamStatus" class="status-indicator status-offline"></span>
            <span id="statusText">Offline</span>
        </p>
    </div>
    
    <div id="controls">
        <button id="startStreamBtn" class="btn-primary">Start Livestream</button>
        <button id="stopStreamBtn" class="btn-danger" disabled>End Livestream</button>
        <button id="joinBtn" disabled>Join Livestream</button>
    </div>
    
    <div id="videoContainer">
        <video id="hostVideo" autoplay playsinline muted></video>
        <div id="viewersList">
            <h3>Viewers (<span id="viewerCount">0</span>)</h3>
            <ul id="viewers"></ul>
        </div>
    </div>
    
    <div id="chatContainer">
        <h2>Live Chat</h2>
        <div id="chatMessages"></div>
        <div>
            <input type="text" id="chatInput" placeholder="Type your message..." disabled>
            <button id="sendChatBtn" disabled>Send</button>
        </div>
    </div>
    
    <div id="createClassModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('createClassModal')">&times;</span>
            <h2>Start Livestream</h2>
            <div id="createClassForm">
                <div class="form-group">
                    <label for="streamClass">Select Class</label>
                    <select id="streamClass" required>
                        <option value="">Choose a class...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="title">Stream Name</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="4" required></textarea>
                </div>
                <div class="form-actions">
                    <button class="btn-primary" onclick="startLivestream()">Start Livestream</button>
                    <button type="button" class="btn-outline" onclick="closeModal('createClassModal')">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const config = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };
        
        // Global variables
        let peerConnection = null;
        let localStream = null;
        let dataChannel = null;
        let userId = generateId();
        let userName = `User_${Math.floor(Math.random() * 1000)}`;
        let isHost = false;
        let socket = null;
        let streamActive = false;
        let streamStartTime = null;
        let streamEndTime = null;
        let totalUniqueViewers = new Set();
        let mediaRecorder = null;
        let recordedChunks = [];
        let currentStreamData = {
            title: '',
            description: '',
            classId: ''
        };
        
        // DOM Elements
        const startBtn = document.getElementById('startStreamBtn');
        const joinBtn = document.getElementById('joinBtn');
        const stopBtn = document.getElementById('stopStreamBtn');
        const hostVideo = document.getElementById('hostVideo');
        const chatInput = document.getElementById('chatInput');
        const sendChatBtn = document.getElementById('sendChatBtn');
        const chatMessages = document.getElementById('chatMessages');
        const viewersList = document.getElementById('viewers');
        const viewerCount = document.getElementById('viewerCount');
        const streamStatus = document.getElementById('streamStatus');
        const statusText = document.getElementById('statusText');
        
        // Helper functions
        function generateId() {
            return Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
        }
        
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        
        function escapeHtml(s) {
            if (!s) return '';
            return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[ch]);
        }
        
        function showModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.style.display = 'flex';
            }
        }
        
        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) {
                modal.style.display = 'none';
            }
        }
        
        // Update stream status UI
        function updateStreamStatus(isActive) {
            streamActive = isActive;
            if (isActive) {
                streamStatus.className = 'status-indicator status-live';
                statusText.textContent = 'Live';
                if (!isHost) {
                    joinBtn.disabled = false;
                }
            } else {
                streamStatus.className = 'status-indicator status-offline';
                statusText.textContent = 'Offline';
                joinBtn.disabled = true;
            }
        }
        
        // Load instructor classes
        async function loadInstructorClasses() {
            try {
                const user = JSON.parse(localStorage.getItem('user'));
                if (!user) return;
                const userId = user.id;
                const res = await fetch('https://fissk-backend.onrender.com/register/instructor/classes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: userId })
                });
                const json = await res.json();
                const classes = Array.isArray(json?.classes) ? json.classes : [];
                const streamClass = document.getElementById('streamClass');
                if (streamClass) {
                    streamClass.innerHTML = '<option value="">Choose a class...</option>' + 
                        classes.map(c => `<option value="${c._id || c.id}">${escapeHtml(c.title)}</option>`).join('');
                }
            } catch (err) {
                console.error('loadInstructorClasses error', err);
            }
        }
        
        // Initialize WebSocket connection
        function initWebSocket() {
            if (socket && socket.readyState === WebSocket.OPEN) return;
            
            socket = new WebSocket('wss://fissk-backend.onrender.com');
            
            socket.onopen = () => {
                console.log('WebSocket connected');
                if (isHost) {
                    socket.send(JSON.stringify({ type: 'register_host', userId }));
                } else {
                    socket.send(JSON.stringify({ type: 'register_viewer', userId, userName }));
                }
                socket.send(JSON.stringify({ type: 'request_stream_status' }));
            };
            
            socket.onmessage = (event) => {
                const message = JSON.parse(event.data);
                console.log('Message received:', message.type);
                handleServerMessage(message);
            };
            
            socket.onclose = () => {
                console.log('WebSocket disconnected, reconnecting...');
                setTimeout(initWebSocket, 3000);
            };
        }
        
        function handleServerMessage(message) {
            switch (message.type) {
                case 'stream_status':
                    updateStreamStatus(message.active);
                    break;
                case 'offer':
                    handleOffer(message);
                    break;
                case 'answer':
                    handleAnswer(message);
                    break;
                case 'ice_candidate':
                    handleIceCandidate(message);
                    break;
                case 'chat_message':
                    displayChatMessage(message);
                    break;
                case 'viewer_list':
                    updateViewersList(message.viewers);
                    break;
                case 'stream_ended':
                    handleStreamEnded();
                    break;
            }
        }
        
        // Setup data channel
        function setupDataChannel(channel) {
            dataChannel = channel;
            
            channel.onopen = () => {
                console.log('Data channel opened');
                chatInput.disabled = false;
                sendChatBtn.disabled = false;
            };
            
            channel.onclose = () => {
                console.log('Data channel closed');
                if (!isHost) {
                    chatInput.disabled = true;
                    sendChatBtn.disabled = true;
                }
            };
            
            channel.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    if (message.type === 'chat_message') {
                        displayChatMessage(message);
                    }
                } catch (error) {
                    console.error('Error parsing message:', error);
                }
            };
        }
        
        // Start Livestream (Host)
        async function startLivestream() {
            try {
                const title = document.getElementById('title').value;
                const description = document.getElementById('description').value;
                const classId = document.getElementById('streamClass').value;
                
                if (!classId || !title) {
                    alert('Please select a class and enter a stream name');
                    return;
                }
                
                currentStreamData = { title, description, classId };
                closeModal('createClassModal');
                
                isHost = true;
                
                // Get user media
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: true, 
                    audio: true 
                });
                hostVideo.srcObject = localStream;
                hostVideo.muted = false;
                
                // Initialize WebSocket
                initWebSocket();
                
                // Wait for connection
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Create peer connection
                peerConnection = new RTCPeerConnection(config);
                
                // Add local stream to connection
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
                
                // Create data channel
                dataChannel = peerConnection.createDataChannel('chat');
                setupDataChannel(dataChannel);
                
                // Set up ICE candidate handler
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate && socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({
                            type: 'ice_candidate',
                            candidate: event.candidate,
                            userId
                        }));
                    }
                };
                
                // Create and send offer
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                
                socket.send(JSON.stringify({
                    type: 'offer',
                    offer: offer,
                    userId
                }));
                
                // Start recording
                startRecording();
                
                // Update UI
                startBtn.disabled = true;
                stopBtn.disabled = false;
                joinBtn.disabled = true;
                chatInput.disabled = false;
                sendChatBtn.disabled = false;
                streamStartTime = Date.now();
                updateStreamStatus(true);
                
                console.log('Livestream started as host');
            } catch (error) {
                console.error('Error starting stream:', error);
                alert('Failed to start stream. Please check your camera and microphone permissions.');
                isHost = false;
                startBtn.disabled = false;
            }
        }
        
        // Stop Livestream (Host)
        async function stopLivestream() {
            if (!confirm('Are you sure you want to end the livestream?')) return;
            
            try {
                streamEndTime = Date.now();
                const durationSeconds = Math.floor((streamEndTime - streamStartTime) / 1000);
                const durationMinutes = Math.floor(durationSeconds / 60);
                
                // Stop recording and save
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    await new Promise((resolve) => {
                        mediaRecorder.onstop = async () => {
                            const blob = new Blob(recordedChunks, { type: 'video/webm' });
                            await saveStreamToServer(blob, durationMinutes, durationSeconds);
                            resolve();
                        };
                        mediaRecorder.stop();
                    });
                }
                
                // Close peer connection
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }
                
                // Stop local stream
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                    localStream = null;
                }
                
                // Notify server
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify({ type: 'stream_ended' }));
                }
                
                // Reset UI
                hostVideo.srcObject = null;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                chatInput.disabled = true;
                sendChatBtn.disabled = true;
                isHost = false;
                updateStreamStatus(false);
                
                console.log('Livestream ended');
            } catch (error) {
                console.error('Error stopping stream:', error);
            }
        }
        
        // Join Livestream (Viewer)
        async function joinLivestream() {
            try {
                joinBtn.disabled = true;
                
                isHost = false;
                
                // Initialize WebSocket
                initWebSocket();
                
                // Wait for connection
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Create peer connection
                peerConnection = new RTCPeerConnection(config);
                
                // Handle incoming tracks (video/audio from host)
                peerConnection.ontrack = (event) => {
                    console.log('Received remote stream');
                    if (event.streams[0]) {
                        hostVideo.srcObject = event.streams[0];
                        hostVideo.muted = false;
                    }
                };
                
                // Handle data channel
                peerConnection.ondatachannel = (event) => {
                    console.log('Data channel received');
                    setupDataChannel(event.channel);
                };
                
                // Handle ICE candidates
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate && socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({
                            type: 'ice_candidate',
                            candidate: event.candidate,
                            userId
                        }));
                    }
                };
                
                // Create and send offer
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                
                socket.send(JSON.stringify({
                    type: 'offer',
                    offer: offer,
                    userId
                }));
                
                console.log('Requested to join livestream');
            } catch (error) {
                console.error('Error joining stream:', error);
                joinBtn.disabled = false;
                alert('Failed to join stream. Please try again.');
            }
        }
        
        // Handle incoming offer
        async function handleOffer(message) {
            if (isHost && message.userId !== userId) {
                try {
                    let pc = peerConnection;
                    if (!pc) {
                        pc = new RTCPeerConnection(config);
                        
                        // Add local stream tracks
                        if (localStream) {
                            localStream.getTracks().forEach(track => {
                                pc.addTrack(track, localStream);
                            });
                        }
                        
                        pc.onicecandidate = (event) => {
                            if (event.candidate && socket && socket.readyState === WebSocket.OPEN) {
                                socket.send(JSON.stringify({
                                    type: 'ice_candidate',
                                    candidate: event.candidate,
                                    userId,
                                    targetId: message.userId
                                }));
                            }
                        };
                        
                        peerConnection = pc;
                    }
                    
                    await pc.setRemoteDescription(new RTCSessionDescription(message.offer));
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    
                    socket.send(JSON.stringify({
                        type: 'answer',
                        answer: answer,
                        userId,
                        targetId: message.userId
                    }));
                } catch (error) {
                    console.error('Error handling offer:', error);
                }
            }
        }
        
        // Handle answer
        async function handleAnswer(message) {
            if (!isHost && message.targetId === userId && peerConnection) {
                try {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(message.answer));
                    console.log('Answer received and set');
                    
                    // Enable chat after connection
                    if (dataChannel && dataChannel.readyState === 'open') {
                        chatInput.disabled = false;
                        sendChatBtn.disabled = false;
                    }
                } catch (error) {
                    console.error('Error handling answer:', error);
                }
            }
        }
        
        // Handle ICE candidate
        async function handleIceCandidate(message) {
            try {
                if (isHost && message.targetId === userId) {
                    if (peerConnection && message.candidate) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(message.candidate));
                    }
                } else if (!isHost && message.userId !== userId && peerConnection && message.candidate) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(message.candidate));
                }
            } catch (error) {
                console.error('Error adding ICE candidate:', error);
            }
        }
        
        // Handle stream ended
        function handleStreamEnded() {
            if (!isHost) {
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }
                hostVideo.srcObject = null;
                chatInput.disabled = true;
                sendChatBtn.disabled = true;
                joinBtn.disabled = false;
                updateStreamStatus(false);
                alert('The livestream has ended');
            }
        }
        
        // Update viewers list
        function updateViewersList(viewers) {
            viewersList.innerHTML = '';
            viewers.forEach(viewer => {
                const li = document.createElement('li');
                li.className = 'viewer-item';
                li.textContent = viewer.name || viewer.userName || 'Anonymous';
                viewersList.appendChild(li);
                totalUniqueViewers.add(viewer.id || viewer.userId);
            });
            viewerCount.textContent = viewers.length;
        }
        
        // Send chat message
        function sendChatMessage() {
            const message = chatInput.value.trim();
            if (!message) return;
            
            const chatMsg = {
                type: 'chat_message',
                userId: userId,
                userName: isHost ? '🎙️ Host' : userName,
                message: message,
                timestamp: new Date().toISOString()
            };
            
            // Try sending through data channel first
            if (dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(JSON.stringify(chatMsg));
                displayChatMessage(chatMsg);
                chatInput.value = '';
            } 
            // Fallback to WebSocket
            else if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(chatMsg));
                if (isHost) {
                    displayChatMessage(chatMsg);
                }
                chatInput.value = '';
            }
        }
        
        // Display chat message
        function displayChatMessage(msg) {
            const messageElement = document.createElement('div');
            messageElement.className = 'message';
            const timestamp = msg.timestamp ? formatTime(msg.timestamp) : 'just now';
            messageElement.innerHTML = `
                <strong>${escapeHtml(msg.userName || 'Unknown')}:</strong> ${escapeHtml(msg.message)}
                <span class="message-time">${timestamp}</span>
            `;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            // Keep only last 200 messages
            while (chatMessages.children.length > 200) {
                chatMessages.removeChild(chatMessages.firstChild);
            }
        }
        
        // Recording functions
        function startRecording() {
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(localStream);
            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };
            mediaRecorder.start(1000);
        }
        
        async function saveStreamToServer(blob, durationMinutes, durationSeconds) {
            try {
                const user = JSON.parse(localStorage.getItem('user'));
                if (!user) return;
                
                // Get class name
                const classRes = await fetch(`https://fissk-backend.onrender.com/register/class/${currentStreamData.classId}`);
                const classData = await classRes.json();
                const className = classData.classA?.[0]?.title || 'Unknown Class';
                
                const streamName = `${className}_${currentStreamData.title}_${Date.now()}`;
                const duration = `${durationMinutes} minutes, ${durationSeconds} seconds`;
                const participants = totalUniqueViewers.size;
                
                const formData = new FormData();
                formData.append('video', blob, `${streamName}.webm`);
                formData.append('userId', user.id);
                formData.append('streamName', streamName);
                formData.append('streamClass', currentStreamData.classId);
                formData.append('classTitle', currentStreamData.title);
                formData.append('classDescription', currentStreamData.description);
                formData.append('participants', participants);
                formData.append('duration', duration);
                
                const response = await fetch('https://fissk-backend.onrender.com/api/save-stream', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    console.log('Stream saved successfully');
                }
            } catch (error) {
                console.error('Error saving stream:', error);
            }
        }
        
        // Event listeners
        startBtn.addEventListener('click', () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user || user.user_type !== 'instructor') {
                alert('Only instructors can start livestreams');
                return;
            }
            loadInstructorClasses().then(() => showModal('createClassModal'));
        });
        
        stopBtn.addEventListener('click', stopLivestream);
        joinBtn.addEventListener('click', joinLivestream);
        sendChatBtn.addEventListener('click', sendChatMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendChatMessage();
        });
        
        // Set user name from localStorage
        const storedUser = JSON.parse(localStorage.getItem('user'));
        if (storedUser) {
            userName = storedUser.name || storedUser.email || userName;
        }
        
        // Initialize
        initWebSocket();
    </script>
</body>
</html>
