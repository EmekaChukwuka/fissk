<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FISSK Online Academy - Live Class</title>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.6/dist/livekit-client.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Google+Sans+Display:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #202124;
            --bg-secondary: #2d2e30;
            --bg-elevated: #3c3d40;
            --bg-hover: #404144;
            --surface: #1a1b1e;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0a6;
            --text-muted: #5f6368;
            --accent-blue: #8ab4f8;
            --accent-blue-hover: #aecbfa;
            --accent-green: #81c995;
            --accent-red: #f28b82;
            --accent-yellow: #fdd663;
            --border: rgba(255,255,255,0.08);
            --border-subtle: rgba(255,255,255,0.04);
            --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 4px 8px rgba(0,0,0,0.3);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Google Sans', 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── TOP BAR ── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 12px;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .topbar-logo {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .topbar-logo span {
            color: var(--accent-blue);
        }
        .live-badge {
            display: none;
            align-items: center;
            gap: 6px;
            background: rgba(242,139,130,0.15);
            border: 1px solid rgba(242,139,130,0.3);
            color: var(--accent-red);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .live-badge.active { display: flex; }
        .live-dot {
            width: 7px; height: 7px;
            background: var(--accent-red);
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .stream-title-bar {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 400;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ── CONNECTION STATUS PILL ── */
        .conn-pill {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
            white-space: nowrap;
        }
        .conn-pill.connected    { background: rgba(129,201,149,0.15); color: var(--accent-green); }
        .conn-pill.connecting   { background: rgba(253,214,99,0.12); color: var(--accent-yellow); }
        .conn-pill.disconnected { background: rgba(242,139,130,0.12); color: var(--accent-red); }

        /* ── MAIN LAYOUT ── */
        .main {
            flex: 1;
            display: flex;
            gap: 0;
            overflow: hidden;
            height: calc(100vh - 57px);
        }

        /* ── VIDEO AREA ── */
        .video-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            overflow: hidden;
            min-width: 0;
        }
        .video-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            min-height: 0;
        }
        .video-tile {
            background: var(--surface);
            border-radius: var(--radius-lg);
            overflow: hidden;
            position: relative;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-tile video {
            width: 100%; height: 100%;
            object-fit: cover;
            background: var(--surface);
        }
        .tile-label {
            position: absolute;
            bottom: 10px; left: 10px;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }
        .tile-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--text-muted);
            width: 100%;
            height: 100%;
            text-align: center;
            padding: 16px;
        }
        .tile-empty-icon {
            width: 56px; height: 56px;
            background: var(--bg-elevated);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
        }
        .tile-empty p { font-size: 13px; }

        .recording-badge {
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(242,139,130,0.9);
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
        }
        .recording-badge.active { display: flex; }
        .rec-dot {
            width: 7px; height: 7px;
            background: #fff;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        /* ── CONTROL BAR ── */
        .control-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 0;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .ctrl-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: var(--bg-elevated);
            border: none;
            border-radius: var(--radius-md);
            color: var(--text-primary);
            cursor: pointer;
            padding: 12px 20px;
            font-size: 13px;
            font-family: inherit;
            font-weight: 500;
            transition: background 0.15s, transform 0.1s;
            min-width: 90px;
        }
        .ctrl-btn:hover:not(:disabled) {
            background: var(--bg-hover);
            transform: translateY(-1px);
        }
        .ctrl-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }
        .ctrl-btn .btn-icon { font-size: 20px; line-height: 1; }
        .ctrl-btn.btn-go-live {
            background: #1a73e8;
            color: #fff;
        }
        .ctrl-btn.btn-go-live:hover:not(:disabled) { background: #1557b0; }
        .ctrl-btn.btn-end {
            background: rgba(242,139,130,0.2);
            color: var(--accent-red);
            border: 1px solid rgba(242,139,130,0.3);
        }
        .ctrl-btn.btn-end:hover:not(:disabled) {
            background: rgba(242,139,130,0.3);
        }
        .ctrl-btn.btn-join {
            background: rgba(129,201,149,0.15);
            color: var(--accent-green);
            border: 1px solid rgba(129,201,149,0.25);
        }
        .ctrl-btn.btn-join:hover:not(:disabled) {
            background: rgba(129,201,149,0.25);
        }
        .ctrl-btn.btn-refresh {
            background: var(--bg-secondary);
            color: var(--text-secondary);
        }

        /* ── SIDE PANEL ── */
        .side-panel {
            width: 320px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .panel-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
        }
        .panel-tab {
            flex: 1;
            padding: 14px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border: none;
            background: none;
            font-family: inherit;
            transition: color 0.15s;
            border-bottom: 2px solid transparent;
        }
        .panel-tab.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }
        .panel-tab:hover:not(.active) { color: var(--text-primary); }

        .panel-section {
            display: none;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-section.active { display: flex; }

        /* People panel */
        .people-header {
            padding: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-subtle);
        }
        .people-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            list-style: none;
        }
        .people-list::-webkit-scrollbar { width: 4px; }
        .people-list::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 4px; }
        .viewer-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            transition: background 0.1s;
        }
        .viewer-item:hover { background: var(--bg-elevated); }
        .viewer-avatar {
            width: 32px; height: 32px;
            background: var(--accent-blue);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px;
            font-weight: 600;
            color: #202124;
            flex-shrink: 0;
        }
        .viewer-name { font-size: 13px; color: var(--text-primary); }

        /* Chat panel */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 4px; }
        .chat-msg { display: flex; flex-direction: column; gap: 2px; }
        .chat-msg-header {
            display: flex; align-items: baseline; gap: 8px;
            flex-wrap: wrap;
        }
        .chat-msg-name { font-size: 12px; font-weight: 600; color: var(--accent-blue); }
        .chat-msg-time { font-size: 11px; color: var(--text-muted); }
        .chat-msg-text { 
            font-size: 13px; 
            color: var(--text-primary); 
            line-height: 1.4;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .chat-input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid var(--border);
        }
        #chatInput {
            flex: 1;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 24px;
            color: var(--text-primary);
            padding: 9px 16px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
            min-width: 0;
        }
        #chatInput:focus { border-color: var(--accent-blue); }
        #chatInput::placeholder { color: var(--text-muted); }
        #chatInput:disabled { opacity: 0.4; cursor: not-allowed; }
        #sendChatBtn {
            width: 36px; height: 36px;
            background: #1a73e8;
            border: none;
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s;
        }
        #sendChatBtn:hover:not(:disabled) { background: #1557b0; }
        #sendChatBtn:disabled { opacity: 0.35; cursor: not-allowed; }

        /* ── STREAM INFO BANNER ── */
        .stream-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(129,201,149,0.08);
            border: 1px solid rgba(129,201,149,0.2);
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--accent-green);
            margin: 0 16px;
            flex-shrink: 0;
        }
        .stream-banner.inactive {
            background: rgba(255,255,255,0.03);
            border-color: var(--border);
            color: var(--text-muted);
        }

        /* ── MODAL ── */
        .modal {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 28px;
            border-radius: var(--radius-xl);
            max-width: 480px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .modal-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .modal-close {
            width: 32px; height: 32px;
            background: var(--bg-elevated);
            border: none;
            border-radius: 50%;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
            flex-shrink: 0;
        }
        .modal-close:hover { background: var(--bg-hover); }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus { border-color: var(--accent-blue); }
        .form-group select option { background: var(--bg-elevated); }
        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        .btn-modal-cancel {
            padding: 10px 20px;
            background: var(--bg-elevated);
            border: none;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            font-weight: 500;
            transition: background 0.15s;
        }
        .btn-modal-cancel:hover { background: var(--bg-hover); }
        .btn-modal-confirm {
            padding: 10px 24px;
            background: #1a73e8;
            border: none;
            border-radius: var(--radius-sm);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            font-weight: 500;
            transition: background 0.15s;
        }
        .btn-modal-confirm:hover { background: #1557b0; }

        .upload-status {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 10px;
            display: none;
        }
        .upload-status.active { display: block; }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 24px; left: 50%;
            transform: translateX(-50%) translateY(8px);
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 500;
            z-index: 9999;
            box-shadow: var(--shadow-lg);
            animation: toastIn 0.25s ease forwards;
            max-width: 90vw;
            white-space: normal;
            text-align: center;
        }
        .toast.error { color: var(--accent-red); border-color: rgba(242,139,130,0.3); }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(-50%) translateY(16px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* Error message banner */
        .error-banner {
            display: none;
            background: rgba(242,139,130,0.12);
            border: 1px solid rgba(242,139,130,0.3);
            color: var(--accent-red);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin: 0 16px 12px 16px;
            font-size: 13px;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .error-banner.show {
            display: flex;
        }
        .error-banner .error-icon {
            font-size: 18px;
        }
        .error-banner .error-text {
            flex: 1;
        }
        .error-banner .error-retry {
            background: rgba(242,139,130,0.2);
            border: none;
            color: var(--accent-red);
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
        }
        .error-banner .error-retry:hover {
            background: rgba(242,139,130,0.3);
        }

        /* Warning banner */
        .warning-banner {
            display: none;
            background: rgba(253,214,99,0.12);
            border: 1px solid rgba(253,214,99,0.3);
            color: var(--accent-yellow);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin: 0 16px 12px 16px;
            font-size: 13px;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .warning-banner.show {
            display: flex;
        }

        /* Success banner */
        .success-banner {
            display: none;
            background: rgba(129,201,149,0.12);
            border: 1px solid rgba(129,201,149,0.3);
            color: var(--accent-green);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin: 0 16px 12px 16px;
            font-size: 13px;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .success-banner.show {
            display: flex;
        }

        /* scrollbar global */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 4px; }

        /* ===== RESPONSIVE BREAKPOINTS ===== */
        @media (max-width: 1024px) {
            .side-panel { width: 280px; }
            .ctrl-btn { padding: 10px 16px; min-width: 80px; }
        }

        @media (max-width: 768px) {
            .topbar { padding: 10px 16px; }
            .topbar-logo { font-size: 16px; }
            .stream-title-bar { max-width: 150px; font-size: 12px; }
            .conn-pill { font-size: 10px; padding: 3px 8px; }
            .main { flex-direction: column; height: auto; }
            .video-area { padding: 12px; }
            .video-grid { grid-template-columns: 1fr; gap: 12px; }
            .side-panel { width: 100%; border-left: none; border-top: 1px solid var(--border); max-height: 350px; }
            .control-bar { padding: 8px 0; gap: 8px; }
            .ctrl-btn { padding: 8px 12px; min-width: 70px; font-size: 11px; }
            .ctrl-btn .btn-icon { font-size: 16px; }
            .stream-banner { margin: 0 12px; font-size: 12px; padding: 6px 12px; }
            .tile-empty-icon { width: 48px; height: 48px; font-size: 20px; }
            .tile-empty p { font-size: 12px; }
        }

        @media (max-width: 600px) {
            .topbar { flex-direction: column; align-items: stretch; text-align: center; }
            .topbar-left { justify-content: center; }
            .topbar-right { justify-content: center; }
            .stream-title-bar { max-width: none; white-space: normal; text-align: center; }
            .ctrl-btn { padding: 6px 10px; min-width: 60px; font-size: 10px; }
            .ctrl-btn .btn-icon { font-size: 14px; }
            .side-panel { max-height: 300px; }
            .panel-tab { padding: 10px; font-size: 12px; }
            .people-header { padding: 12px; font-size: 12px; }
            .chat-input-area { padding: 10px; }
            #chatInput { padding: 8px 12px; font-size: 12px; }
            #sendChatBtn { width: 32px; height: 32px; font-size: 14px; }
            .modal-content { padding: 20px; width: 95%; }
            .modal-header h2 { font-size: 16px; }
            .form-group input, .form-group select, .form-group textarea { padding: 8px 12px; font-size: 13px; }
            .btn-modal-cancel, .btn-modal-confirm { padding: 8px 16px; font-size: 13px; }
            .viewer-avatar { width: 28px; height: 28px; font-size: 12px; }
            .viewer-name { font-size: 12px; }
            .chat-msg-name, .chat-msg-text { font-size: 12px; }
        }

        @media (max-width: 400px) {
            .control-bar { gap: 6px; }
            .ctrl-btn { padding: 5px 8px; min-width: 55px; font-size: 9px; }
            .ctrl-btn .btn-icon { font-size: 12px; }
            .video-area { padding: 8px; }
            .tile-label { font-size: 10px; padding: 3px 8px; }
            .recording-badge { font-size: 9px; padding: 3px 8px; }
            .stream-banner { font-size: 11px; padding: 5px 10px; }
        }

        /* Loading spinner for class preloader */
        .class-loading {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .class-loading::after {
            content: '';
            display: inline-block;
            width: 16px;
            height: 16px;
            margin-left: 8px;
            border: 2px solid var(--accent-blue);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
    <div class="topbar-left">
        <div class="topbar-logo">FISSK Online <span>Academy</span></div>
        <div class="live-badge" id="liveBadge">
            <span class="live-dot"></span> LIVE
        </div>
    </div>
    <div class="topbar-right">
        <span class="stream-title-bar" id="streamTitle"></span>
        <div class="conn-pill connecting" id="connectionStatus">Connecting…</div>
    </div>
</header>

<!-- ERROR/WARNING BANNERS -->
<div id="errorBanner" class="error-banner">
    <span class="error-icon">⚠️</span>
    <span class="error-text" id="errorText">Something went wrong</span>
    <button class="error-retry" onclick="retryLastAction()">Retry</button>
</div>

<div id="warningBanner" class="warning-banner">
    <span class="error-icon">⚠️</span>
    <span class="error-text" id="warningText">Warning</span>
</div>

<div id="successBanner" class="success-banner">
    <span class="error-icon">✅</span>
    <span class="error-text" id="successText">Success</span>
</div>

<!-- MAIN -->
<div class="main">

    <!-- VIDEO + CONTROLS -->
    <div class="video-area">

        <!-- Stream info banner -->
        <div class="stream-banner inactive" id="streamInfo">📭 No active livestream at the moment.</div>

        <!-- Videos -->
        <div class="video-grid">
            <!-- Host tile -->
            <div class="video-tile" id="hostTile">
                <div class="tile-empty" id="hostEmpty">
                    <div class="tile-empty-icon">🎥</div>
                    <p>Your camera (host only)</p>
                </div>
                <video id="hostVideo" autoplay playsinline muted style="display:none;"></video>
                <div class="tile-label" id="videoLabel" style="display:none;">You · Instructor</div>
                <div class="recording-badge" id="recordingBadge">
                    <span class="rec-dot"></span> REC
                </div>
            </div>

            <!-- Remote tile -->
            <div class="video-tile" id="remoteTile">
                <div class="tile-empty" id="remoteEmpty">
                    <div class="tile-empty-icon">📺</div>
                    <p id="remoteEmptyText">Waiting for stream…</p>
                </div>
                <video id="remoteVideo" autoplay playsinline style="display:none;"></video>
                <div class="tile-label" id="remoteVideoLabel" style="display:none;">Instructor's Stream</div>
            </div>
        </div>

        <!-- Control bar -->
        <div class="control-bar">
            <button class="ctrl-btn btn-go-live" id="startStreamBtn">
                <span class="btn-icon">🎙️</span>
                Go Live
            </button>
            <button class="ctrl-btn btn-end" id="stopStreamBtn" disabled>
                <span class="btn-icon">⏹</span>
                End Stream
            </button>
            <button class="ctrl-btn btn-join" id="joinBtn" disabled>
                <span class="btn-icon">👤</span>
                Join Stream
            </button>
            <button class="ctrl-btn btn-refresh" id="refreshStatusBtn">
                <span class="btn-icon">🔄</span>
                Refresh
            </button>
        </div>

    </div>

    <!-- SIDE PANEL -->
    <div class="side-panel">
        <div class="panel-tabs">
            <button class="panel-tab active" onclick="switchTab('people')">👥 People (<span id="viewerCount">0</span>)</button>
            <button class="panel-tab" onclick="switchTab('chat')">💬 Chat</button>
        </div>

        <!-- People -->
        <div class="panel-section active" id="peopleSection">
            <div class="people-header">Students in this session</div>
            <ul class="people-list" id="viewers"></ul>
        </div>

        <!-- Chat -->
        <div class="panel-section" id="chatSection">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Send a message…" disabled>
                <button id="sendChatBtn" disabled title="Send">➤</button>
            </div>
        </div>
    </div>

</div>

<!-- CREATE STREAM MODAL -->
<div id="createClassModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>🎬 Start Livestream</h2>
            <button class="modal-close" onclick="closeModal('createClassModal')">✕</button>
        </div>
        <div class="form-group">
            <label>Select Class *</label>
            <select id="streamClass" required>
                <option value="">Choose a class…</option>
            </select>
        </div>
        <div class="form-group">
            <label>Stream Title *</label>
            <input type="text" id="title" placeholder="e.g., Advanced JavaScript" required>
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea id="description" rows="3" placeholder="What will you teach today?"></textarea>
        </div>
        <div id="uploadStatus" class="upload-status">
            <p>📤 Preparing…</p>
        </div>
        <div class="form-actions">
            <button class="btn-modal-cancel" onclick="closeModal('createClassModal')">Cancel</button>
            <button class="btn-modal-confirm" id="confirmStartBtn">🔴 Go Live</button>
        </div>
    </div>
</div>

<script>
    window.LiveKitClient = window.LivekitClient || window.LiveKitClient;
</script>

<script>
    // ===== CONFIGURATION =====
    const BACKEND_URL = 'https://fissk-backend.onrender.com';

    // ===== GLOBAL VARIABLES =====
    let liveKitRoom = null;
    let localStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isHost = false;
    let isViewer = false;
    let streamActive = false;
    let userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    let userName = '';
    let totalUniqueViewers = new Set();
    let streamStartTime = null;
    let currentStreamData = { title: '', description: '', classId: '' };
    let currentRoomName = null;
    let statusCheckInterval = null;
    let preloadedClasses = [];
    let classesLoaded = false;
    let lastFailedAction = null; // Track last failed action for retry

    // ===== DOM ELEMENTS =====
    const startBtn         = document.getElementById('startStreamBtn');
    const stopBtn          = document.getElementById('stopStreamBtn');
    const joinBtn          = document.getElementById('joinBtn');
    const refreshStatusBtn = document.getElementById('refreshStatusBtn');
    const hostVideo        = document.getElementById('hostVideo');
    const remoteVideo      = document.getElementById('remoteVideo');
    const hostEmpty        = document.getElementById('hostEmpty');
    const remoteEmpty      = document.getElementById('remoteEmpty');
    const remoteEmptyText  = document.getElementById('remoteEmptyText');
    const videoLabel       = document.getElementById('videoLabel');
    const remoteVideoLabel = document.getElementById('remoteVideoLabel');
    const chatInput        = document.getElementById('chatInput');
    const sendChatBtn      = document.getElementById('sendChatBtn');
    const chatMessages     = document.getElementById('chatMessages');
    const viewersList      = document.getElementById('viewers');
    const viewerCountSpan  = document.getElementById('viewerCount');
    const connectionStatusDiv = document.getElementById('connectionStatus');
    const recordingBadge   = document.getElementById('recordingBadge');
    const streamTitleSpan  = document.getElementById('streamTitle');
    const streamInfoDiv    = document.getElementById('streamInfo');
    const liveBadge        = document.getElementById('liveBadge');
    const streamClassSelect = document.getElementById('streamClass');
    const errorBanner      = document.getElementById('errorBanner');
    const errorText        = document.getElementById('errorText');
    const warningBanner    = document.getElementById('warningBanner');
    const warningText      = document.getElementById('warningText');
    const successBanner    = document.getElementById('successBanner');
    const successText      = document.getElementById('successText');

    // ===== HELPER FUNCTIONS =====
    function showError(message, action = null) {
        errorText.textContent = message;
        errorBanner.classList.add('show');
        if (action) lastFailedAction = action;
        
        // Auto-hide after 8 seconds
        setTimeout(() => {
            errorBanner.classList.remove('show');
        }, 8000);
    }

    function hideError() {
        errorBanner.classList.remove('show');
    }

    function showWarning(message) {
        warningText.textContent = message;
        warningBanner.classList.add('show');
        setTimeout(() => {
            warningBanner.classList.remove('show');
        }, 5000);
    }

    function showSuccess(message) {
        successText.textContent = message;
        successBanner.classList.add('show');
        setTimeout(() => {
            successBanner.classList.remove('show');
        }, 4000);
    }

    function retryLastAction() {
        hideError();
        if (lastFailedAction === 'startStream') {
            startLivestream();
        } else if (lastFailedAction === 'joinStream') {
            joinLivestream();
        } else if (lastFailedAction === 'loadClasses') {
            preloadInstructorClasses();
        } else if (lastFailedAction === 'checkStatus') {
            checkStreamStatus();
        }
    }

    function switchTab(tab) {
        document.querySelectorAll('.panel-tab').forEach((t, i) => {
            t.classList.toggle('active', (i === 0 && tab === 'people') || (i === 1 && tab === 'chat'));
        });
        document.getElementById('peopleSection').classList.toggle('active', tab === 'people');
        document.getElementById('chatSection').classList.toggle('active', tab === 'chat');
    }

    function escapeHtml(s) {
        if (!s) return '';
        return String(s).replace(/[&<>]/g, m =>
            m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'
        );
    }

    function formatTime(timestamp) {
        try { return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
        catch(e) { return ''; }
    }

    function showModal(id) { 
        if (classesLoaded && preloadedClasses.length > 0) {
            document.getElementById(id).style.display = 'flex';
        } else if (!classesLoaded) {
            streamClassSelect.innerHTML = '<option value="" disabled selected>Loading classes...</option>';
            document.getElementById(id).style.display = 'flex';
            preloadInstructorClasses();
        } else {
            document.getElementById(id).style.display = 'flex';
        }
    }
    
    function closeModal(id) { 
        document.getElementById(id).style.display = 'none';
        hideError();
    }

    function showToast(msg, isError = false) {
        const t = document.createElement('div');
        t.className = 'toast' + (isError ? ' error' : '');
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function updateConnectionStatus(status, msg) {
        connectionStatusDiv.className = 'conn-pill ' + status;
        connectionStatusDiv.textContent = msg;
        
        // Also show in console for debugging
        console.log(`[Connection] ${status}: ${msg}`);
    }

    function showHostVideo(show) {
        hostVideo.style.display = show ? 'block' : 'none';
        hostEmpty.style.display = show ? 'none' : 'flex';
        videoLabel.style.display = show ? 'block' : 'none';
    }

    function showRemoteVideo(show) {
        remoteVideo.style.display = show ? 'block' : 'none';
        remoteEmpty.style.display = show ? 'none' : 'flex';
        remoteVideoLabel.style.display = show ? 'block' : 'none';
    }

    function updateStreamStatus(isLive, title = '') {
        streamActive = isLive;

        if (isLive) {
            liveBadge.classList.add('active');
            streamInfoDiv.className = 'stream-banner';
            streamInfoDiv.innerHTML = '🎬 A livestream is currently active! Click "Join Stream" to watch.';
            if (title) streamTitleSpan.textContent = title;

            if (!isHost && !isViewer) {
                joinBtn.disabled = false;
            }
        } else {
            liveBadge.classList.remove('active');
            streamInfoDiv.className = 'stream-banner inactive';
            streamInfoDiv.innerHTML = '📭 No active livestream at the moment.';
            streamTitleSpan.textContent = '';
            joinBtn.disabled = true;

            if (!isHost) {
                showRemoteVideo(false);
                remoteEmptyText.textContent = 'Waiting for stream…';
            }
        }
    }

    async function checkStreamStatus() {
        try {
            updateConnectionStatus('connecting', 'Checking server status...');
            const response = await fetch(`${BACKEND_URL}/api/stream-status`);
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            const data = await response.json();
            updateStreamStatus(data.active === true);
            updateConnectionStatus('connected', 'Connected to server');
            return data.active;
        } catch (err) {
            console.error('Status check failed:', err);
            updateConnectionStatus('disconnected', 'Cannot connect to server');
            showError(`Cannot connect to server: ${err.message}`, 'checkStatus');
            return false;
        }
    }

    // ===== PRELOAD CLASSES FUNCTION =====
    async function preloadInstructorClasses() {
        try {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user || user.user_type !== 'instructor') {
                console.log('Not an instructor, skipping class preload');
                classesLoaded = true;
                return;
            }
            
            console.log('Preloading instructor classes...');
            updateConnectionStatus('connecting', 'Loading your classes...');
            
            const res = await fetch(`${BACKEND_URL}/register/instructor/classes`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: user.id })
            });
            
            if (!res.ok) {
                throw new Error(`HTTP ${res.status}: Failed to load classes`);
            }
            
            const json = await res.json();
            preloadedClasses = json.classes || [];
            
            if (preloadedClasses.length > 0) {
                streamClassSelect.innerHTML = '<option value="">Choose a class…</option>' +
                    preloadedClasses.map(c => `<option value="${c._id || c.id}">${escapeHtml(c.title)}</option>`).join('');
                console.log(`✅ Preloaded ${preloadedClasses.length} classes`);
                showSuccess(`Loaded ${preloadedClasses.length} classes`);
            } else {
                streamClassSelect.innerHTML = '<option value="">No classes found. Please create a class first.</option>';
                showWarning('No classes found. Please create a class before starting a livestream.');
            }
            classesLoaded = true;
            updateConnectionStatus('connected', 'Ready');
            return preloadedClasses;
        } catch(err) {
            console.error('Error preloading classes:', err);
            streamClassSelect.innerHTML = '<option value="">Error loading classes. Click Retry.</option>';
            showError(`Failed to load classes: ${err.message}`, 'loadClasses');
            classesLoaded = true;
            return [];
        }
    }

    async function loadInstructorClasses() {
        if (classesLoaded && preloadedClasses.length > 0) {
            return preloadedClasses;
        }
        return await preloadInstructorClasses();
    }

    // ===== MUX UPLOAD FUNCTIONS =====
    async function uploadToMux(blob, streamName, classId, classTitle) {
    const uploadStatus = document.getElementById('uploadStatus');
    uploadStatus.classList.add('active');
    uploadStatus.innerHTML = '<p>📤 Getting upload URL from Mux…</p>';
    
    try {
        const user = JSON.parse(localStorage.getItem('user'));
        const instructorName = user?.name || 'Instructor';
        
        // 1. Get a direct upload URL from Mux with title
        const uploadResponse = await fetch(`${BACKEND_URL}/api/mux/create-upload`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                streamName: streamName,
                classId: classId,
                classTitle: classTitle,
                instructorName: instructorName,
            }),
        });
        
        if (!uploadResponse.ok) {
            throw new Error(`Mux API error: ${uploadResponse.status}`);
        }
        
        const { success, uploadUrl, uploadId } = await uploadResponse.json();
        
        if (!success) {
            throw new Error('Failed to get upload URL from Mux');
        }
        
        uploadStatus.innerHTML = '<p>📤 Uploading to Mux… (this may take a few minutes)</p>';
        
        // 2. Upload the blob directly to Mux
        const response = await fetch(uploadUrl, {
            method: 'PUT',
            body: blob,
            headers: {
                'Content-Type': 'video/webm',
            },
        });
        
        if (!response.ok) {
            throw new Error(`Upload to Mux failed: ${response.status}`);
        }
        
        uploadStatus.innerHTML = '<p>⏳ Processing upload… Mux is creating your asset</p>';
        
        // 3. Poll for upload completion
        let assetId = null;
        let playbackId = null;
        let attempts = 0;
        const maxAttempts = 60;
        
        while (attempts < maxAttempts) {
            await new Promise(r => setTimeout(r, 5000));
            
            const statusResponse = await fetch(`${BACKEND_URL}/api/mux/upload-status/${uploadId}`);
            const statusData = await statusResponse.json();
            
            if (statusData.status === 'asset_created' || statusData.status === 'ready') {
                assetId = statusData.assetId;
                playbackId = statusData.playbackId;
                console.log(`✅ Mux asset ready: ${assetId}, title: ${classTitle}`);
                break;
            } else if (statusData.status === 'errored') {
                throw new Error('Mux processing failed');
            }
            
            attempts++;
            uploadStatus.innerHTML = `<p>⏳ Processing upload… (${Math.floor(attempts * 5)} seconds)</p>`;
        }
        
        if (!assetId || !playbackId) {
            throw new Error('Upload timed out - asset not ready');
        }
        
        uploadStatus.innerHTML = '<p>✅ Upload complete! Saving to database…</p>';
        
        const duration = Math.floor((Date.now() - streamStartTime) / 1000);
        const minutes = Math.floor(duration / 60);
        
        // 4. Save metadata to your backend
        const saveResponse = await fetch(`${BACKEND_URL}/api/save-stream`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userId: user?.id,
                streamName: streamName,
                streamClass: currentStreamData.classId,
                classTitle: currentStreamData.title,
                classDescription: currentStreamData.description,
                participants: totalUniqueViewers.size,
                duration: `${minutes} min, ${duration % 60} sec`,
                muxAssetId: assetId,
                muxPlaybackId: playbackId,
            }),
        });
        
        if (!saveResponse.ok) {
            console.warn('Metadata save failed, but video was uploaded');
            showWarning('Video saved to Mux, but metadata save failed. Contact support.');
        }
        
        uploadStatus.classList.remove('active');
        showSuccess(`✅ Recording "${classTitle}" saved to Mux successfully!`);
        return { assetId, playbackId, playbackUrl: `https://stream.mux.com/${playbackId}.m3u8` };
        
    } catch (err) {
        uploadStatus.classList.remove('active');
        console.error('Mux upload error:', err);
        showError(`Mux upload failed: ${err.message}`, null);
        throw err;
    }
}

    // ===== LIVEKIT FUNCTIONS =====
    async function getLiveKitToken(roomName, participantName, isHostUser) {
        try {
            const response = await fetch(`${BACKEND_URL}/api/livekit/token`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomName, participantName, isHost: isHostUser })
            });
            
            if (!response.ok) {
                throw new Error(`Token request failed: ${response.status}`);
            }
            
            return await response.json();
        } catch (err) {
            console.error('Token fetch error:', err);
            throw new Error(`Cannot connect to server: ${err.message}`);
        }
    }

    function setupLiveKitChat(room) {
        room.on(LiveKitClient.RoomEvent.DataReceived, (payload, participant) => {
            try {
                const message = JSON.parse(new TextDecoder().decode(payload));
                if (message.type === 'chat') {
                    appendChatMessage(participant.identity, message.text);
                }
            } catch (e) { console.error('Chat parse error:', e); }
        });
    }

    function appendChatMessage(sender, text, isSelf = false) {
        const div = document.createElement('div');
        div.className = 'chat-msg';
        div.innerHTML = `
            <div class="chat-msg-header">
                <span class="chat-msg-name">${escapeHtml(isSelf ? 'You' : sender)}</span>
                <span class="chat-msg-time">${formatTime(new Date())}</span>
            </div>
            <div class="chat-msg-text">${escapeHtml(text)}</div>
        `;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        switchTab('chat');
    }

    async function sendLiveKitChatMessage(room, message) {
        if (!room || !message.trim()) return;
        const encoder = new TextEncoder();
        const data = encoder.encode(JSON.stringify({ type: 'chat', text: message }));
        await room.localParticipant.publishData(data);
        appendChatMessage(room.localParticipant.identity, message, true);
    }

    function updateViewersFromLiveKit(room) {
        if (!room) return;
        const participants = Array.from(room.remoteParticipants.values());
        viewersList.innerHTML = '';
        let viewerCount = 0;
        participants.forEach(p => {
            if (p.identity !== 'Instructor') {
                const li = document.createElement('li');
                li.className = 'viewer-item';
                const initial = (p.identity || '?')[0].toUpperCase();
                li.innerHTML = `
                    <div class="viewer-avatar">${initial}</div>
                    <span class="viewer-name">${escapeHtml(p.identity)}</span>
                `;
                viewersList.appendChild(li);
                totalUniqueViewers.add(p.identity);
                viewerCount++;
            }
        });
        viewerCountSpan.textContent = viewerCount;
    }

    // ===== HOST: START LIVESTREAM =====
    async function startLivestream() {
        const title       = document.getElementById('title').value;
        const description = document.getElementById('description').value;
        const classId     = document.getElementById('streamClass').value;

        if (!classId || !title) {
            showError('Please select a class and enter a title', null);
            alert('Please select a class and enter a title');
            return;
        }

        try {
            hideError();
            lastFailedAction = 'startStream';
            updateConnectionStatus('connecting', 'Starting stream...');
            
            closeModal('createClassModal');
            isHost = true;
            currentStreamData = { title, description, classId };
            currentRoomName = `class_${classId}_${Date.now()}`;
            streamTitleSpan.textContent = title;

            showToast('Requesting camera and microphone…');
            updateConnectionStatus('connecting', 'Requesting camera access...');
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: true
                });
                showSuccess('Camera and microphone access granted');
            } catch (cameraErr) {
                if (cameraErr.name === 'NotAllowedError') {
                    throw new Error('Camera/microphone access denied. Please allow access and try again.');
                } else if (cameraErr.name === 'NotFoundError') {
                    throw new Error('No camera or microphone found on this device.');
                } else {
                    throw new Error(`Camera error: ${cameraErr.message}`);
                }
            }

            hostVideo.srcObject = localStream;
            showHostVideo(true);

            updateConnectionStatus('connecting', 'Connecting to LiveKit...');
            showToast('Connecting to LiveKit…');

            const { token, url } = await getLiveKitToken(currentRoomName, 'Instructor', true);
            
            if (!token) {
                throw new Error('Invalid token received from server');
            }

            liveKitRoom = new LiveKitClient.Room();
            
            liveKitRoom.on(LiveKitClient.RoomEvent.Connected, () => {
                updateConnectionStatus('connected', '🔴 Live - Streaming');
                showSuccess('Connected to LiveKit! Publishing stream...');
            });
            
            liveKitRoom.on(LiveKitClient.RoomEvent.Disconnected, () => {
                updateConnectionStatus('disconnected', 'Disconnected from LiveKit');
                showWarning('Disconnected from LiveKit. Stream may have ended.');
            });
            
            liveKitRoom.on(LiveKitClient.RoomEvent.Reconnecting, () => {
                updateConnectionStatus('connecting', 'Reconnecting to LiveKit...');
                showWarning('Connection lost. Reconnecting...');
            });
            
            liveKitRoom.on(LiveKitClient.RoomEvent.ParticipantConnected, (participant) => {
                showSuccess(`${participant.identity} joined the class`);
                updateViewersFromLiveKit(liveKitRoom);
            });
            
            liveKitRoom.on(LiveKitClient.RoomEvent.ParticipantDisconnected, (participant) => {
                showToast(`${participant.identity} left`);
                updateViewersFromLiveKit(liveKitRoom);
            });

            await liveKitRoom.connect(url, token);
            await liveKitRoom.localParticipant.setCameraEnabled(true);
            await liveKitRoom.localParticipant.setMicrophoneEnabled(true);
            setupLiveKitChat(liveKitRoom);

            const sessionResponse = await fetch(`${BACKEND_URL}/api/livekit/start-session`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomName: currentRoomName, title, description, classId, userId })
            });
            
            if (!sessionResponse.ok) {
                console.warn('Session start notification failed, but stream continues');
                showWarning('Stream started but session notification failed');
            }

            startBtn.disabled = true;
            stopBtn.disabled = false;
            joinBtn.disabled = true;
            chatInput.disabled = false;
            sendChatBtn.disabled = false;
            recordingBadge.classList.add('active');
            liveBadge.classList.add('active');
            updateStreamStatus(true, title);
            streamStartTime = Date.now();

            recordedChunks = [];
            mediaRecorder = new MediaRecorder(localStream, {
                mimeType: 'video/webm',
                videoBitsPerSecond: 1000000
            });
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.start(10000);

            showSuccess('✅ Livestream started! Students can now join.');
            updateConnectionStatus('connected', '🔴 Live - Streaming');
            lastFailedAction = null;

        } catch(err) {
            console.error('Start stream error:', err);
            showError(`Failed to start stream: ${err.message}`, 'startStream');
            isHost = false;
            startBtn.disabled = false;
            if (localStream) { 
                localStream.getTracks().forEach(t => t.stop()); 
                localStream = null; 
            }
            showHostVideo(false);
            updateConnectionStatus('disconnected', 'Stream start failed');
        }
    }

    // ===== STOP LIVESTREAM =====
    async function stopLivestream() {
        if (!confirm('End stream and save recording?')) return;
        
        try {
            hideError();
            recordingBadge.classList.remove('active');
            updateConnectionStatus('connecting', 'Ending stream...');
            showToast('Processing recording…');
            
            let recordingBlob = null;
            
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                await new Promise(r => { mediaRecorder.onstop = r; mediaRecorder.stop(); });
                
                if (recordedChunks.length > 0) {
                    recordingBlob = new Blob(recordedChunks, { type: 'video/webm' });
                    console.log(`Recording size: ${(recordingBlob.size / 1024 / 1024).toFixed(2)} MB`);
                }
            }
            
            if (liveKitRoom) {
                await liveKitRoom.disconnect();
                liveKitRoom = null;
            }
            
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            hostVideo.srcObject = null;
            showHostVideo(false);
            
            if (recordingBlob && recordingBlob.size > 0) {
                const streamName = `${currentStreamData.title.replace(/[^a-z0-9]/gi, '_')}_${Date.now()}`;
                
                try {
                    updateConnectionStatus('connecting', 'Uploading to Mux...');
                    showToast('📤 Uploading recording to Mux…');
                    const result = await uploadToMux(recordingBlob, streamName, currentStreamData.classId, currentStreamData.title);
                    console.log('Mux asset:', result);
                } catch(uploadErr) {
                    console.error('Upload failed:', uploadErr);
                    showError(`Mux upload failed: ${uploadErr.message}. Recording saved locally.`, null);
                    const url = URL.createObjectURL(recordingBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${streamName}.webm`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }
            } else {
                showWarning('No recording data to save');
            }
            
            await fetch(`${BACKEND_URL}/api/livekit/end-session`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomName: currentRoomName })
            }).catch(e => console.warn('Session end notification failed:', e));
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
            chatInput.disabled = true;
            sendChatBtn.disabled = true;
            isHost = false;
            streamStartTime = null;
            currentRoomName = null;
            updateStreamStatus(false);
            streamTitleSpan.textContent = '';
            updateConnectionStatus('disconnected', 'Stream ended');
            liveBadge.classList.remove('active');
            
            showSuccess('Stream ended successfully');
            
        } catch(err) {
            console.error('Stop stream error:', err);
            showError(`Error ending stream: ${err.message}`, null);
            alert('Error ending stream: ' + err.message);
        }
    }

    // ===== JOIN STREAM (VIEWER) =====
    async function joinLivestream() {
        const isActive = await checkStreamStatus();
        if (!isActive) { 
            showError('No live stream available', null);
            showToast('No live stream available', true); 
            return; 
        }

        try {
            hideError();
            lastFailedAction = 'joinStream';
            updateConnectionStatus('connecting', 'Finding active stream...');
            
            const response = await fetch(`${BACKEND_URL}/api/active-stream`);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const data = await response.json();
            if (!data.isActive || data.streams.length === 0) {
                throw new Error('No active stream found');
            }
            
            const activeStream = data.streams[0];
            currentRoomName = activeStream.roomName;
            currentStreamData.title = activeStream.title;
            streamTitleSpan.textContent = activeStream.title;
            
        } catch(err) {
            console.error('Get active stream error:', err);
            showError(`Cannot find active stream: ${err.message}`, 'joinStream');
            updateConnectionStatus('disconnected', 'No stream found');
            return;
        }

        joinBtn.disabled = true;
        joinBtn.querySelector('.btn-icon').textContent = '⏳';
        startBtn.disabled = true;
        remoteEmptyText.textContent = 'Connecting…';
        updateConnectionStatus('connecting', 'Connecting to class...');

        try {
            const studentName = localStorage.getItem('studentName') || prompt('Enter your name:', 'Student') || 'Student';
            localStorage.setItem('studentName', studentName);

            const { token, url } = await getLiveKitToken(currentRoomName, studentName, false);
            
            if (!token) {
                throw new Error('Invalid token received');
            }
            
            liveKitRoom = new LiveKitClient.Room();

            liveKitRoom.on(LiveKitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
                if (track.kind === 'video' && participant.identity === 'Instructor') {
                    track.attach(remoteVideo);
                    showRemoteVideo(true);
                    remoteVideoLabel.textContent = "Instructor's Stream";
                    updateConnectionStatus('connected', '📺 Watching class');
                    showSuccess('Connected to class!');
                }
            });

            liveKitRoom.on(LiveKitClient.RoomEvent.Connected, () => {
                isViewer = true;
                chatInput.disabled = false;
                sendChatBtn.disabled = false;
                updateConnectionStatus('connected', '📺 Watching class');
                startBtn.disabled = true;
            });

            liveKitRoom.on(LiveKitClient.RoomEvent.Disconnected, () => {
                updateConnectionStatus('disconnected', 'Disconnected');
                updateStreamStatus(false);
                showRemoteVideo(false);
                isViewer = false;
                const user = JSON.parse(localStorage.getItem('user'));
                if (user && user.user_type === 'instructor') startBtn.disabled = false;
                showWarning('Disconnected from stream');
            });

            liveKitRoom.on(LiveKitClient.RoomEvent.Reconnecting, () => {
                updateConnectionStatus('connecting', 'Reconnecting...');
                showWarning('Connection lost. Reconnecting...');
            });

            liveKitRoom.on(LiveKitClient.RoomEvent.ParticipantDisconnected, (participant) => {
                if (participant.identity === 'Instructor') {
                    showError('Instructor has ended the class', null);
                    showRemoteVideo(false);
                    remoteEmptyText.textContent = 'Class ended';
                    updateStreamStatus(false);
                    isViewer = false;
                    chatInput.disabled = true;
                    sendChatBtn.disabled = true;
                    joinBtn.disabled = false;
                    joinBtn.querySelector('.btn-icon').textContent = '👤';
                    const user = JSON.parse(localStorage.getItem('user'));
                    if (user && user.user_type === 'instructor') startBtn.disabled = false;
                }
            });

            liveKitRoom.on(LiveKitClient.RoomEvent.ParticipantConnected, () => updateViewersFromLiveKit(liveKitRoom));
            liveKitRoom.on(LiveKitClient.RoomEvent.ParticipantDisconnected, () => updateViewersFromLiveKit(liveKitRoom));

            await liveKitRoom.connect(url, token);
            setupLiveKitChat(liveKitRoom);
            updateViewersFromLiveKit(liveKitRoom);

            joinBtn.querySelector('.btn-icon').textContent = '✅';
            joinBtn.disabled = true;
            lastFailedAction = null;

        } catch(err) {
            console.error('Join error:', err);
            showError(`Failed to join: ${err.message}`, 'joinStream');
            joinBtn.disabled = false;
            joinBtn.querySelector('.btn-icon').textContent = '👤';
            isViewer = false;
            const user = JSON.parse(localStorage.getItem('user'));
            if (user && user.user_type === 'instructor') startBtn.disabled = false;
            updateConnectionStatus('disconnected', 'Connection failed');
        }
    }

    // ===== SEND CHAT =====
    async function sendChatMessage() {
        const message = chatInput.value.trim();
        if (!message || !liveKitRoom) return;
        try {
            await sendLiveKitChatMessage(liveKitRoom, message);
            chatInput.value = '';
        } catch (err) {
            console.error('Chat send error:', err);
            showWarning('Failed to send message. Try again.');
        }
    }

    // ===== EVENT LISTENERS =====
    document.getElementById('confirmStartBtn').addEventListener('click', startLivestream);

    startBtn.addEventListener('click', async () => {
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.user_type !== 'instructor') {
            showError('Only instructors can start livestreams', null);
            alert('Only instructors can start livestreams');
            return;
        }
        userName = user.name || user.email || 'Instructor';
        userId = user.id || userId;
        
        if (classesLoaded && preloadedClasses.length > 0) {
            showModal('createClassModal');
        } else {
            showToast('Loading your classes...');
            await preloadInstructorClasses();
            showModal('createClassModal');
        }
    });

    stopBtn.addEventListener('click', stopLivestream);
    joinBtn.addEventListener('click', joinLivestream);
    refreshStatusBtn.addEventListener('click', async () => {
        showToast('Checking stream status…');
        await checkStreamStatus();
    });
    sendChatBtn.addEventListener('click', sendChatMessage);
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChatMessage(); });

    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) event.target.style.display = 'none';
    };

    // ===== INITIALIZE =====
    const storedUser = JSON.parse(localStorage.getItem('user'));
    if (storedUser) {
        userName = storedUser.name || storedUser.email || 'User';
        userId = storedUser.id || userId;
    } else {
        userName = prompt('Enter your name:', 'Viewer') || 'Viewer';
    }

    isHost = false;
    isViewer = false;

    if (storedUser && storedUser.user_type === 'instructor') {
        console.log('Instructor detected, preloading classes...');
        preloadInstructorClasses();
    } else {
        console.log('Not an instructor, skipping class preload');
        classesLoaded = true;
    }

    statusCheckInterval = setInterval(() => {
        if (!isHost && !liveKitRoom) checkStreamStatus();
    }, 15000); // Check every 15 seconds

    checkStreamStatus();
    updateConnectionStatus('connecting', 'Initializing...');
    console.log('App initialized. User:', userId, userName);
    
    // Expose retry function globally
    window.retryLastAction = retryLastAction;
</script>
</body>
