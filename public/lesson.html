<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson - FISSK Online Academy</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="fissklogo.jpg">
    <style>
        /* Lesson styles */
        .lesson-page {
            padding: 80px 0 40px;
            background: var(--gray-light);
            min-height: 100vh;
        }

        .lesson-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Sidebar - Table of Contents */
        .lesson-sidebar {
            position: sticky;
            top: 80px;
            height: fit-content;
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .lesson-sidebar h4 {
            font-size: 1rem;
            color: var(--text-dark);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .lesson-sidebar .lesson-list {
            list-style: none;
            padding: 0;
        }

        .lesson-sidebar .lesson-item {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
            color: var(--text-light);
            border-left: 3px solid transparent;
        }

        .lesson-sidebar .lesson-item:hover {
            background: var(--gray-light);
            color: var(--text-dark);
        }

        .lesson-sidebar .lesson-item.active {
            background: rgba(139, 95, 191, 0.08);
            color: var(--primary);
            border-left-color: var(--primary);
            font-weight: 500;
        }

        .lesson-sidebar .lesson-item.completed {
            border-left-color: #10B981;
        }

        .lesson-sidebar .lesson-item .lesson-status {
            float: right;
            font-size: 0.8rem;
        }

        /* Main Content */
        .lesson-content {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .lesson-content .lesson-header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .lesson-content .lesson-header h1 {
            font-size: 1.8rem;
            color: var(--text-dark);
        }

        .lesson-content .lesson-header .lesson-meta {
            display: flex;
            gap: 16px;
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .lesson-content .lesson-body {
            color: var(--text-dark);
            line-height: 1.8;
        }

        .lesson-content .lesson-body .content-item {
            margin-bottom: 24px;
            padding: 16px;
            background: var(--gray-light);
            border-radius: 10px;
            border-left: 4px solid var(--primary);
        }

        .lesson-content .lesson-body .content-item .item-type {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--primary);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .lesson-content .lesson-body .content-item .item-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 8px 0 4px;
        }

        .lesson-content .lesson-body .content-item .item-content {
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .lesson-content .lesson-body .content-item .item-content img {
            max-width: 100%;
            border-radius: 8px;
        }

        .lesson-content .lesson-body .content-item .item-content iframe {
            width: 100%;
            height: 400px;
            border-radius: 8px;
            border: none;
        }

        .lesson-content .lesson-footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .complete-btn {
            padding: 10px 24px;
            background: #10B981;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .complete-btn:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .complete-btn.completed {
            background: var(--gray-light);
            color: var(--text-light);
            cursor: default;
        }

        .complete-btn.completed:hover {
            transform: none;
        }

        /* Content Type Icons */
        .content-type-icon {
            display: inline-block;
            margin-right: 8px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .lesson-container {
                grid-template-columns: 1fr;
            }

            .lesson-sidebar {
                position: static;
                margin-bottom: 20px;
            }

            .lesson-content {
                padding: 20px;
            }

            .lesson-content .lesson-header h1 {
                font-size: 1.4rem;
            }

            .lesson-content .lesson-body .content-item .item-content iframe {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>FISSK</h2>
                <span>Online Academy</span>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="classes.html" class="nav-link">Classes</a></li>
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li class="nav-user">
                    <div class="user-dropdown" id="user-dropdown"></div>
                </li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <section class="lesson-page">
        <div class="container" style="max-width: 1200px;">
            <div class="lesson-container">
                <!-- Sidebar -->
                <div class="lesson-sidebar">
                    <h4>📚 Table of Contents</h4>
                    <ul class="lesson-list" id="lessonList">
                        <li style="padding: 12px; color: var(--text-light); text-align: center;">
                            Loading lessons...
                        </li>
                    </ul>
                </div>

                <!-- Main Content -->
                <div class="lesson-content" id="lessonContent">
                    <div class="lesson-header">
                        <h1 id="lessonTitle">Select a lesson</h1>
                        <div class="lesson-meta">
                            <span id="lessonPosition">Lesson 1 of 0</span>
                            <span id="lessonDuration">⏱️ 0 min</span>
                            <span id="lessonStatus">🔒 Locked</span>
                        </div>
                    </div>
                    <div class="lesson-body" id="lessonBody">
                        <p style="color: var(--text-light); text-align: center; padding: 40px 0;">
                            Select a lesson from the sidebar to begin learning.
                        </p>
                    </div>
                    <div class="lesson-footer">
                        <button class="btn btn-outline" id="prevLessonBtn">← Previous</button>
                        <button class="complete-btn" id="completeBtn">✅ Mark as Complete</button>
                        <button class="btn btn-primary" id="nextLessonBtn">Next →</button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="lesson.js"></script>
</body>
</html>
